<script type="module">
const { h, render, Component: PComponent } = window.preact;
const html = window.htm.bind(h);
const FORM_ENDPOINT = "https://zamex-forms.jurabaev2005.workers.dev/";
const GEO_ENDPOINT = "https://zamex-forms.jurabaev2005.workers.dev/geo";
let savedTheme = "light";
try { savedTheme = localStorage.getItem("zamex-theme") === "dark" ? "dark" : "light"; } catch (e) {}
let savedLang = "";
try { savedLang = localStorage.getItem("zamex-lang") || ""; } catch (e) {}
// Language: the visitor's own choice wins; otherwise pick by country; if unknown, Russian.
const RU_COUNTRIES = ["RU", "BY", "KZ", "KG", "UZ", "TM", "AZ", "AM", "MD", "GE"];
const langForCountry = (c) => !c ? "ru" : c === "TJ" ? "tg" : RU_COUNTRIES.includes(c) ? "ru" : "en";
const geoLang = savedLang ? Promise.resolve(savedLang) : (() => {
  try { const cached = sessionStorage.getItem("zamex-geo-lang"); if (cached) return Promise.resolve(cached); } catch (e) {}
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 2500);
  return fetch(GEO_ENDPOINT, { signal: ctrl.signal }).then((r) => r.json()).then((d) => langForCountry(String(d.country || "").toUpperCase()))
    .catch(() => "ru").then((l) => { clearTimeout(timer); try { sessionStorage.setItem("zamex-geo-lang", l); } catch (e) {} return l; });
})();
let geoReady = "";
try { geoReady = sessionStorage.getItem("zamex-geo-lang") || ""; } catch (e) {}
class DCLogic extends PComponent {
  constructor(props) {
    super(props);
    this.state = { theme: savedTheme };
    if (savedLang) this.state.lang = savedLang; else if (geoReady) this.state.lang = geoReady;
    if (!savedLang && !geoReady) geoLang.then((l) => { if (!this._langPicked) PComponent.prototype.setState.call(this, { lang: l }); });
  }
  setState(update, cb) {
    try {
      const u = typeof update === "function" ? null : update;
      if (u && u.theme) localStorage.setItem("zamex-theme", u.theme);
      if (u && u.lang) { this._langPicked = true; localStorage.setItem("zamex-lang", u.lang); }
    } catch (e) {}
    return super.setState(update, cb);
  }
}

class Page extends DCLogic {
  _fitText() {
    // Keep every paragraph to at most 3 lines: shrink the text a little (never below 12px) until it fits.
    cancelAnimationFrame(this._fitRaf);
    this._fitRaf = requestAnimationFrame(() => {
      document.querySelectorAll("p").forEach((el) => {
        if (!el.offsetParent || !el.textContent.trim()) return;
        if (!el.dataset.fs0) { el.dataset.fs0 = getComputedStyle(el).fontSize; el.dataset.mw0 = el.style.maxWidth || ""; }
        el.style.fontSize = el.dataset.fs0;
        el.style.maxWidth = el.dataset.mw0;
        let fs = parseFloat(el.dataset.fs0);
        const lines = () => { const lh = parseFloat(getComputedStyle(el).lineHeight) || fs * 1.5; return Math.round(el.offsetHeight / lh); };
        if (lines() > 3 && el.dataset.mw0) { el.style.maxWidth = "none"; }
        while (lines() > 3 && fs > 12) { fs -= 0.5; el.style.fontSize = fs + "px"; }
      });
    });
  }
  componentDidUpdate() { if (this._fitText) this._fitText(); }
  componentDidMount() {
    this._fitText();
    this._onFitResize = () => this._fitText();
    window.addEventListener("resize", this._onFitResize, { passive: true });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this._fitText());
    const doc = document;
    const root = doc.documentElement;
    // Browsers only autoplay video that is muted *as an attribute* and inline on iPhone; enforce both, then start playback.
    this._kick = () => {
      doc.querySelectorAll("video").forEach((v) => {
        v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true;
        v.setAttribute("muted", ""); v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", ""); v.setAttribute("autoplay", "");
        if (v.paused) { const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); }
      });
    };
    this._kick();
    this._kickT1 = setTimeout(this._kick, 300);
    this._kickT2 = setTimeout(this._kick, 1500);
    this._kickScroll = () => { if (this._kickRaf) return; this._kickRaf = requestAnimationFrame(() => { this._kickRaf = 0; this._kick(); }); };
    doc.addEventListener("scroll", this._kickScroll, { passive: true, capture: true });
    doc.addEventListener("touchstart", this._kick, { passive: true });
    doc.addEventListener("click", this._kick);
    doc.addEventListener("visibilitychange", this._kick);
    // Sticky navbar: hidden over the hero (it has its own nav), always visible once you scroll past it.
    const snav = doc.querySelector(".zx-snav");
    const secIds = ["otc", "how", "security"];
    let lastY = 0;
    this._navScroll = () => {
      if (this._navRaf) return;
      this._navRaf = requestAnimationFrame(() => {
        this._navRaf = 0;
        const hero = doc.getElementById("top");
        if (!hero || !snav) return;
        const vh = window.innerHeight || 800;
        const hr = hero.getBoundingClientRect();
        const y = -hr.top;
        const dy = y - lastY;
        lastY = y;
        const pastHero = hr.bottom < 90;
        const pinned = this.state && (this.state.open2 || this.state.nav);
        snav.classList.toggle("zx-snav--show", pastHero || !!pinned && hr.bottom < vh * 0.5);
        const wrap = hero.parentElement;
        if (wrap) {
          const wr = wrap.getBoundingClientRect();
          root.style.setProperty("--sp", Math.max(0, Math.min(1, -wr.top / Math.max(1, wr.height - vh))).toFixed(4));
        }
        let active = "";
        secIds.forEach((id) => { const el = doc.getElementById(id); if (el && el.getBoundingClientRect().top <= vh * 0.4) active = id; });
        snav.querySelectorAll(".zx-snl").forEach((a) => a.classList.toggle("zx-active", a.getAttribute("data-sec") === active));
      });
    };
    doc.addEventListener("scroll", this._navScroll, { passive: true, capture: true });
    window.addEventListener("resize", this._navScroll, { passive: true });
    this._navScroll();
    if (!window.matchMedia || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    root.classList.add("zx-js");
    const SEL = ".zx-reveal, .zm-card, .zx-line, .zm-masthead";
    const reveal = (el) => el.classList.add("zx-in");
    if ("IntersectionObserver" in window) {

        entries.forEach((e) => { if (e.isIntersecting) { reveal(e.target); this._io.unobserve(e.target); } });
      }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
    }
    this._scan = () => {
      doc.querySelectorAll(SEL).forEach((el) => {
        if (el.dataset.zxObs) return;
        el.dataset.zxObs = "1";
        if (this._io) this._io.observe(el); else reveal(el);
      });
    };

    this._failsafe = setTimeout(() => doc.querySelectorAll(SEL).forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight) reveal(el);
