<html lang="en">
<head>

<meta property="og:url" content="https://zamex.tj/contact.html">

<meta property="og:locale:alternate" content="ru_RU">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F5F5}
a{color:#0A1626}a:hover{color:#C2410C}
button:focus-visible,a:focus-visible{outline:2px solid #C2410C;outline-offset:3px}
.fx-in{width:100%;box-sizing:border-box;min-height:52px;padding:0 16px;border-radius:14px;border:1px solid rgba(10,22,38,.12);background:#F6F7F8;color:#0A1626;font:400 16px Onest,system-ui,sans-serif;outline:none;transition:border-color .2s,box-shadow .2s,background-color .2s}
.fx-in::placeholder{color:rgba(10,22,38,.38)}
.fx-in:hover{border-color:rgba(10,22,38,.24)}
.fx-in:focus{border-color:#0A1626;background:#FFFFFF;box-shadow:0 0 0 4px rgba(10,22,38,.08)}
textarea.fx-in{min-height:120px;padding:14px 16px;resize:vertical;line-height:1.5}
select.fx-in{appearance:none;-webkit-appearance:none;padding-right:44px;cursor:pointer}
.fx-err .fx-in{border-color:#C2410C;background:#FFF8F5}
.fx-pill{transition:transform .2s ease,opacity .2s ease}
.fx-pill:hover{opacity:.9}
.fx-pill:active{transform:scale(.98)}
.fx-seg{min-height:48px;flex:1 1 0;border:1px solid rgba(10,22,38,.12);border-radius:12px;cursor:pointer;font:500 15px Onest,system-ui,sans-serif;transition:background-color .2s,color .2s,border-color .2s}
@keyframes fx-up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fx-kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.fx-up{animation:fx-up .8s cubic-bezier(.16,1,.3,1) both}
.fx-kb{animation:fx-kb 16s ease-in-out infinite alternate}
.fx-links{display:flex}
@media (max-width: 860px){.fx-links{display:none}}
.zx-theme-t{--zx-bg:#F5F5F5;--zx-surface:#FFFFFF;--zx-field:#F6F7F8;--zx-media:#DCDDDF;--zx-ink:#0A1626;--zx-ink-rgb:10,22,38;--zx-btn:#0A1626;--zx-btn-ink:#FFFFFF;--zx-fade-rgb:238,239,240;--zx-glass:rgba(255,255,255,0.6);--zx-navglass:rgba(248,248,248,0.8);transition:background-color .35s ease,color .35s ease}
.zx-dark{--zx-bg:#07111E;--zx-surface:#0F1C2E;--zx-field:#0F1C2E;--zx-media:#0F1C2E;--zx-ink:#E6EBF1;--zx-ink-rgb:230,235,241;--zx-btn:#E6EBF1;--zx-btn-ink:#0A1626;--zx-fade-rgb:7,17,30;--zx-glass:rgba(255,255,255,0.08);--zx-navglass:rgba(12,24,40,0.78);color-scheme:dark}
.zx-dark .zx-snav-in{background:rgba(12,24,40,.74);border-color:rgba(255,255,255,.1)}
.zx-dark .zx-snl{color:rgba(230,235,241,.72)}
.zx-dark .zx-snl:hover,.zx-dark .zx-snl.zx-active{color:#FFFFFF;background:rgba(255,255,255,.08)}
.zx-dark .zx-bwlogo{filter:invert(1)}
.zx-dark .fx-in{background:#0F1C2E;border-color:rgba(255,255,255,.14);color:#E6EBF1}
.zx-dark .fx-in::placeholder{color:rgba(230,235,241,.4)}
.zx-dark .fx-in:focus{background:#13233A;border-color:#E6EBF1;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.zx-dark .fx-err .fx-in{background:#2A1610;border-color:#FF8A57}
.zx-dark .fx-seg{border-color:rgba(255,255,255,.14)}
.zx-dark a:hover{color:#FF8A57}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition-duration:.01ms !important}}
</style>
<style>#app:empty{min-height:100vh;background:#F5F5F5}</style>

async function sendForm(kind, vals, side) {
  const labelOf = (id) => { const el = document.getElementById("fx-" + id); if (!el) return ""; if (el.tagName === "SELECT") return el.value === "" ? "" : el.options[el.selectedIndex].text; return el.value; };

  document.querySelectorAll('[id^="fx-"]').forEach((el) => { const k = el.id.slice(3); const v = labelOf(k); if (v) data[NAMES[k] || k] = v; });
  if (kind === "quote") { data.side = side === "sell" ? "Sell" : "Buy"; }

<main>
<section style="padding: clamp(56px, 9vh, 96px) clamp(20px, 6vw, 104px) 40px">
<div class="fx-up" style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 18px">
<span style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: var(--zx-surface); border: 1px solid rgba(var(--zx-ink-rgb),0.1); font-size: 14px; font-weight: 500"><span style="width: 8px; height: 8px; border-radius: 50%; background: #FF6A2B"></span>${v.t.badge}</span>
<h1 style="margin: 0; max-width: 16em; font-size: clamp(38px, 5vw, 68px); font-weight: 500; line-height: 1.04; letter-spacing: -0.04em; text-wrap: balance">${v.t.h1}</h1>
<p style="margin: 0; max-width: 34em; font-size: 18px; line-height: 1.6; color: rgba(var(--zx-ink-rgb),0.65)">${v.t.sub}</p>
</div>
</section>

<section style="padding: 0 clamp(20px, 6vw, 104px) 40px">
<div class="fx-up" style="animation-delay: .12s; max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(400px, 100%), 1fr)); border-radius: 32px; overflow: hidden; background: var(--zx-surface); box-shadow: 0 30px 60px -40px rgba(var(--zx-ink-rgb),0.35)">

<aside style="position: relative; overflow: hidden; min-height: 520px; padding: clamp(28px, 4vw, 48px); display: flex; flex-direction: column; justify-content: space-between; gap: 32px; background: #0B2239; color: #FFFFFF">
<img src="manager.jpg" alt="" class="fx-kb" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%" />
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,34,57,0.9) 0%, rgba(11,34,57,0.35) 38%, rgba(11,34,57,0.45) 60%, rgba(11,34,57,0.95) 100%)"></div>
<div style="position: relative; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; max-width: 12em; font-size: clamp(26px, 2.6vw, 36px); font-weight: 500; line-height: 1.1; letter-spacing: -0.03em">${v.t.panelTitle}</h2>
<p style="margin: 0; max-width: 26em; font-size: 16px; line-height: 1.6; color: rgba(255,255,255,0.75)">${v.t.panelText}</p>
</div>
<div style="position: relative">
<dl style="margin: 0; display: grid; gap: 14px"><div style="display: flex; flex-direction: column; gap: 2px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.16)"><dt style="font-size: 13px; color: rgba(255,255,255,0.6)">${v.c.emailL}</dt><dd style="margin: 0; font-size: 16px; font-weight: 500"><a href="mailto:info@zamex.tj" style="color: #FFFFFF; text-decoration: none">info@zamex.tj</a></dd></div><div style="display: flex; flex-direction: column; gap: 2px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.16)"><dt style="font-size: 13px; color: rgba(255,255,255,0.6)">${v.c.locL}</dt><dd style="margin: 0; font-size: 16px; font-weight: 500"><span>${v.c.locV}</span></dd></div><div style="display: flex; flex-direction: column; gap: 2px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.16)"><dt style="font-size: 13px; color: rgba(255,255,255,0.6)">${v.c.hoursL}</dt><dd style="margin: 0; font-size: 16px; font-weight: 500"><span>${v.c.hoursV}</span></dd></div></dl>
</div>
</aside>

<div style="padding: clamp(28px, 4vw, 48px)">
${(v.sent) ? html`
<div role="status" class="fx-up" style="min-height: 420px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 16px">
<span style="width: 56px; height: 56px; border-radius: 50%; background: var(--zx-btn); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF8A57" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
<h2 style="margin: 0; font-size: clamp(28px, 3vw, 38px); font-weight: 500; letter-spacing: -0.03em">${v.t.okTitle}</h2>
<p style="margin: 0; max-width: 28em; font-size: 16px; line-height: 1.6; color: rgba(var(--zx-ink-rgb),0.7)">${v.t.okText}</p>
<button type="button" onClick="${v.again}" class="fx-pill" style="min-height: 48px; padding: 0 22px; border: 1px solid rgba(var(--zx-ink-rgb),0.18); border-radius: 999px; background: transparent; color: var(--zx-ink); cursor: pointer; font: 500 15px Onest, system-ui, sans-serif">${v.t.again}</button>
</div>
` : null}
${(v.notSent) ? html`
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 20px">
<div class="${v.cls.name}" style="display: flex; flex-direction: column; gap: 8px">
<label for="fx-name" style="font-size: 14px; font-weight: 500; color: var(--zx-ink)">${v.t.f_name}</label>
<input id="fx-name" class="fx-in" type="text" autoComplete="name" placeholder="${v.t.p_name}" onInput="${v.on.name}" />
${(v.e.name) ? html`<span role="alert" style="font-size: 13px; color: #C2410C">${v.e.name}</span>` : null}
</div>
<div class="${v.cls.company}" style="display: flex; flex-direction: column; gap: 8px">
<label for="fx-company" style="font-size: 14px; font-weight: 500; color: var(--zx-ink)">${v.t.f_company}</label>
<input id="fx-company" class="fx-in" type="text" autoComplete="organization" placeholder="${v.t.p_company}" onInput="${v.on.company}" />
${(v.e.company) ? html`<span role="alert" style="font-size: 13px; color: #C2410C">${v.e.company}</span>` : null}
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 20px">
<div class="${v.cls.email}" style="display: flex; flex-direction: column; gap: 8px">
<label for="fx-email" style="font-size: 14px; font-weight: 500; color: var(--zx-ink)">${v.t.f_email}</label>
<input id="fx-email" class="fx-in" type="email" autoComplete="email" placeholder="${v.t.p_email}" onInput="${v.on.email}" />
${(v.e.email) ? html`<span role="alert" style="font-size: 13px; color: #C2410C">${v.e.email}</span>` : null}
</div>
<div class="${v.cls.contact}" style="display: flex; flex-direction: column; gap: 8px">
<label for="fx-contact" style="font-size: 14px; font-weight: 500; color: var(--zx-ink)">${v.t.f_contact}</label>
<input id="fx-contact" class="fx-in" type="text" autoComplete="tel" placeholder="${v.t.p_contact}" onInput="${v.on.contact}" />
${(v.e.contact) ? html`<span role="alert" style="font-size: 13px; color: #C2410C">${v.e.contact}</span>` : null}
</div>
</div>
<div class="${v.cls.topic}" style="display: flex; flex-direction: column; gap: 8px">
<label for="fx-topic" style="font-size: 14px; font-weight: 500; color: var(--zx-ink)">${v.t.f_topic}</label>
<div style="position: relative">
<select id="fx-topic" class="fx-in" onChange="${v.on.topic}">
<option value="">${v.t.choose}</option>
${(v.topics || []).map((o) => html`<option value="${o.v}">${o.label}</option>`)}
</select>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--zx-ink); position: absolute; right: 16px; top: 50%; margin-top: -8px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg>
</div>
${(v.e.topic) ? html`<span role="alert" style="font-size: 13px; color: #C2410C">${v.e.topic}</span>` : null}
</div>
<div class="${v.cls.msg}" style="display: flex; flex-direction: column; gap: 8px">
<label for="fx-msg" style="font-size: 14px; font-weight: 500; color: var(--zx-ink)">${v.t.f_msg}</label>
<textarea id="fx-msg" class="fx-in" placeholder="${v.t.p_msg}" onInput="${v.on.msg}"></textarea>
${(v.e.msg) ? html`<span role="alert" style="font-size: 13px; color: #C2410C">${v.e.msg}</span>` : null}
</div>
<button type="button" onClick="${v.submit}" class="fx-pill" style="margin-top: 8px; display: inline-flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; padding: 6px 6px 6px 26px; border: 0; border-radius: 999px; background: var(--zx-btn); color: var(--zx-btn-ink); cursor: pointer; font: 500 16px Onest, system-ui, sans-serif">
<span>${v.btnText}</span>
<span style="width: 44px; height: 44px; border-radius: 50%; background: #FF6A2B; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#06101C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg></span>
</button>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: rgba(var(--zx-ink-rgb),0.55)">${v.t.note}</p>
</div>
` : null}
</div>

</div>
</section>
</main>

<footer style="padding: 32px clamp(20px, 6vw, 104px) 40px">
<div style="max-width: 1240px; margin: 0 auto; padding-top: 24px; border-top: 1px solid rgba(var(--zx-ink-rgb),0.12); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 13px; color: rgba(var(--zx-ink-rgb),0.6)">
<span>${v.c.copy}</span>
<a href="mailto:info@zamex.tj" style="color: rgba(var(--zx-ink-rgb),0.7); text-decoration: none">info@zamex.tj</a>
</div>
</footer>
</div>
`;
};
render(h(Page, {"startLang": "ru"}), document.getElementById("app"));
</script>
