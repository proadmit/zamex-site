<style>
body{margin:0;background:#F5F5F5}
a{color:#0A1626}a:hover{color:#C2410C}
button:focus-visible,a:focus-visible{outline:2px solid #C2410C;outline-offset:3px}
.fx-in{width:100%;box-sizing:border-box;min-height:52px;padding:0 16px;border-radius:14px;border:1px solid rgba(10,22,38,.12);background:#F6F7F8;color:#0A1626;font:400 16px Onest,system-ui,sans-serif;outline:none;transition:border-color .2s,box-shadow .2s,background-color .2s}
.fx-in::placeholder{color:rgba(10,22,38,.38)}
.fx-in:hover{border-color:rgba(10,22,38,.24)}
.fx-in:focus{border-color:#0A1626;background:#FFFFFF;box-shadow:0 0 0 4px rgba(10,22,38,.08)}
textarea.fx-in{min-height:120px;padding:14px 16px;resize:vertical;line-height:1.5}
select.fx-in{appearance:none;-webkit-appearance:none;padding-right:44px;cursor:pointer}
.fx-err .fx-in{border-color:#C2410C;background:#FFF8F5}
.fx-pill{transition:transform .2s ease,opacity .2s ease}
.fx-pill:hover{opacity:.9}
.fx-pill:active{transform:scale(.98)}
.fx-seg{min-height:48px;flex:1 1 0;border:1px solid rgba(10,22,38,.12);border-radius:12px;cursor:pointer;font:500 15px Onest,system-ui,sans-serif;transition:background-color .2s,color .2s,border-color .2s}
@keyframes fx-up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fx-kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.fx-up{animation:fx-up .8s cubic-bezier(.16,1,.3,1) both}
.fx-kb{animation:fx-kb 16s ease-in-out infinite alternate}
.fx-links{display:flex}
@media (max-width: 860px){.fx-links{display:none}}
.zx-theme-t{--zx-bg:#F5F5F5;--zx-surface:#FFFFFF;--zx-field:#F6F7F8;--zx-media:#DCDDDF;--zx-ink:#0A1626;--zx-ink-rgb:10,22,38;--zx-btn:#0A1626;--zx-btn-ink:#FFFFFF;--zx-fade-rgb:238,239,240;--zx-glass:rgba(255,255,255,0.6);--zx-navglass:rgba(248,248,248,0.8);transition:background-color .35s ease,color .35s ease}
.zx-dark{--zx-bg:#07111E;--zx-surface:#0F1C2E;--zx-field:#0F1C2E;--zx-media:#0F1C2E;--zx-ink:#E6EBF1;--zx-ink-rgb:230,235,241;--zx-btn:#E6EBF1;--zx-btn-ink:#0A1626;--zx-fade-rgb:7,17,30;--zx-glass:rgba(255,255,255,0.08);--zx-navglass:rgba(12,24,40,0.78);color-scheme:dark}
.zx-dark .zx-snav-in{background:rgba(12,24,40,.74);border-color:rgba(255,255,255,.1)}
.zx-dark .zx-snl{color:rgba(230,235,241,.72)}
.zx-dark .zx-snl:hover,.zx-dark .zx-snl.zx-active{color:#FFFFFF;background:rgba(255,255,255,.08)}
.zx-dark .zx-bwlogo{filter:invert(1)}
.zx-dark .fx-in{background:#0F1C2E;border-color:rgba(255,255,255,.14);color:#E6EBF1}
.zx-dark .fx-in::placeholder{color:rgba(230,235,241,.4)}
.zx-dark .fx-in:focus{background:#13233A;border-color:#E6EBF1;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.zx-dark .fx-err .fx-in{background:#2A1610;border-color:#FF8A57}
.zx-dark .fx-seg{border-color:rgba(255,255,255,.14)}
.zx-dark a:hover{color:#FF8A57}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition-duration:.01ms !important}}
.zx-doc-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px;align-items:start}
.zx-toc{position:sticky;top:96px;max-height:calc(100vh - 120px);overflow:auto;padding:20px;border-radius:20px;background:var(--zx-surface)}
.zx-toc-a{display:block;padding:6px 10px;border-radius:10px;font-size:13.5px;line-height:1.4;color:rgba(var(--zx-ink-rgb),.72);text-decoration:none}
.zx-toc-a:hover{background:rgba(var(--zx-ink-rgb),.06);color:var(--zx-ink)}
.zx-doc{max-width:780px;padding:clamp(24px,4vw,48px);border-radius:28px;background:var(--zx-surface);font-size:16px;line-height:1.72;color:rgba(var(--zx-ink-rgb),.86)}
.zx-doc p{margin:0 0 14px}
.zx-doc ul{margin:0 0 16px;padding-left:22px}
.zx-doc li{margin:0 0 6px}
.zx-doc strong{color:var(--zx-ink);font-weight:600}
.zx-doc-h{margin:40px 0 14px;font-size:21px;font-weight:600;line-height:1.3;letter-spacing:-.015em;color:var(--zx-ink);scroll-margin-top:100px}
.zx-doc-h:first-child{margin-top:0}
@media (max-width:960px){.zx-doc-grid{grid-template-columns:minmax(0,1fr)}.zx-toc{position:static;max-height:none}}
</style>

<h2 id="en-s1" class="zx-doc-h">1. General Provisions</h2>
<p>1.1. This document is a public offer of Limited Liability Company «ZAM RIVOJ» (LLC «ZAM RIVOJ»), registered under the laws of the Republic of Tajikistan (the "Company"), addressed to an unlimited number of individuals, individual entrepreneurs and legal entities, and contains all essential terms of the commission agreement for transactions with digital assets (the "Agreement").</p>
<p>1.2. The Company is a resident of IT Park (Dushanbe) (resident certificate No. ХХХХ dated ХХ.ХХ.20ХХ) and carries out activities in the field of digital assets and blockchain technologies within the types of activities permitted for IT Park residents.</p>
<p>1.3. The services are provided through the ZAMEX electronic platform (the "Platform"), available at: zamex.tj. ZAMEX is the trade name of the Company's Platform.</p>
<p>1.4. The Company provides over-the-counter (OTC) digital asset exchange services: acting on the Client's instructions, the Company enters, in its own name but for the Client's account, into transactions for the purchase, sale, conversion and transfer of digital assets. The Company does not organise trading by matching Clients' orders against each other, does not accept funds as deposits and does not use Clients' funds and assets for its own trading activities.</p>
<p>1.5. Acceptance of this offer is made by the Client ticking the box confirming agreement with the terms of the offer upon registration on the Platform. From the moment of acceptance, the Agreement is deemed concluded and the Client is deemed to have fully and unconditionally agreed to all terms of the offer and its annexes. An Agreement concluded by acceptance is deemed concluded in writing.</p>
<p>1.6. Annex No. 1 "Tariffs" forms an integral part of this offer. The List of Supported Digital Assets and Networks and the List of Prohibited Jurisdictions are published on the Platform and form part of the Agreement.</p>
<h2 id="en-s2" class="zx-doc-h">2. Terms and Definitions</h2>
<p><strong>Company (Commission Agent)</strong> — LLC «ZAM RIVOJ», a legal entity registered under the laws of the Republic of Tajikistan.</p>
<p><strong>Client (Principal)</strong> — a fully legally capable individual aged 18 or over, an individual entrepreneur or a legal entity, including a non-resident of the Republic of Tajikistan, who has accepted this offer and completed identification.</p>
<p><strong>Platform (ZAMEX)</strong> — the Company's software and hardware system through which the Client registers, completes identification, creates and signs Specifications and receives reports.</p>
<p><strong>Personal Account</strong> — the Client's personal section on the Platform containing information about the Client, Specifications, transactions and reports.</p>
<p><strong>Digital Assets</strong> — digital assets created and recorded in a distributed information system based on blockchain technology.</p>
<p><strong>Instruction (Specification)</strong> — an electronic document created in the Personal Account and signed by the Parties in accordance with Section 8, containing the type of transaction, asset, network, amount, currency, rate, commission, payment details and other terms of a specific transaction.</p>
<p><strong>Fixation Period</strong> — the period from the moment the Client signs the Specification until the end of the Banking Day on which it was signed (Dushanbe time), during which the rate fixed in the Specification remains valid.</p>
<p><strong>Fireblocks</strong> — the technological infrastructure for the storage and transfer of digital assets based on multi-party computation (MPC) technology used by the Company.</p>
<p><strong>Company Wallet</strong> — the Company's address (wallet, sub-account) in the Fireblocks infrastructure to which the Client transfers digital assets for the execution of a Specification.</p>
<p><strong>Partner Platforms</strong> — banks, payment systems, crypto exchanges, digital asset operators and liquidity providers through which the Company executes the Client's Instructions.</p>
<p><strong>Tariffs</strong> — the amount of the Commission Fee set out in Annex No. 1.</p>
<p><strong>Commission Fee (Commission)</strong> — the Company's remuneration for executing an Instruction in the amount set out in the Tariffs.</p>
<p><strong>2FA</strong> — two-factor authentication of the Client using one-time codes sent to the Client's email address and phone number.</p>
<p><strong>Banking Day</strong> — a day on which banks of the Republic of Tajikistan are open for business.</p>
<p><strong>KYC/AML</strong> — customer due diligence procedures and procedures for countering the legalisation (laundering) of criminal proceeds, the financing of terrorism and the financing of the proliferation of weapons of mass destruction (AML/CFT/CPF).</p>
<p><strong>KYT</strong> — screening of blockchain addresses and transactions using blockchain analytics tools.</p>
<p><strong>Competent Authorities</strong> — state authorities of the Republic of Tajikistan exercising control and supervision in the field of AML/CFT/CPF, as well as other authorities to which the Company is required to provide information in cases provided for by law.</p>
<h2 id="en-s3" class="zx-doc-h">3. Subject of the Agreement and Nature of the Services</h2>
<p>3.1. Under the Agreement, the Company (commission agent) undertakes, on the Client's (principal's) instructions and for a fee, to enter in its own name but for the Client's account into transactions with digital assets and funds specified in the Specification.</p>
<p>3.2. Under transactions concluded by the Company with third parties in execution of an Instruction, the Company acquires the rights and obligations. Funds and digital assets received by the Company from the Client, as well as those obtained by the Company for the Client's account, are the property of the Client and are to be transferred to the Client in accordance with the Agreement.</p>
<p>3.3. The Company's sole income under the Agreement is the Commission Fee according to the Tariffs. The Company does not earn income from exchange rate differences (spread). The conversion rate is determined by banks and Partner Platforms; any margin (spread) included by them in the rate is their income and not the income of the Company.</p>
<p>3.4. The Company does not guarantee to the Client the performance of transactions by third parties (del credere) and is not liable for their non-performance, except where the Company failed to exercise due care in selecting a Partner Platform (Section 13).</p>
<h2 id="en-s4" class="zx-doc-h">4. Holding of Digital Assets and Funds</h2>
<p>4.1. Digital assets received from the Client for the execution of an Instruction are recorded in separate (segregated) wallets or sub-accounts opened by the Company in the Fireblocks infrastructure. MPC technology ensures that a private key is never stored in full in a single location and reduces the risk of unauthorised access.</p>
<p>4.2. The Client's funds are credited to the Company's bank accounts and recorded separately for each Client in the Company's internal records.</p>
<p>4.3. The Client's funds and digital assets are held by the Company in transit only, exclusively for the period necessary to execute a specific Instruction, and are transferred to the Client or a recipient designated by the Client within the period specified in the Specification or, if no period is specified, no later than 1 (one) Banking Day after completion of the transaction.</p>
<p>4.4. The Company does not use the Client's funds and digital assets in its own interests, does not pledge, lend or transfer them into trust management, and does not commingle them with its own assets.</p>
<p>4.5. The Company does not provide long-term (custodial) storage of the Client's digital assets and does not accrue interest or any other income on them.</p>
<h2 id="en-s5" class="zx-doc-h">5. Client Requirements. Identification</h2>
<p>5.1. The services are provided to:</p>
<ul>
<li><p>individuals aged 18 or over with full legal capacity, acting in their own name and in their own interests;</p></li>
<li><p>individual entrepreneurs;</p></li>
<li><p>legal entities, both residents and non-residents of the Republic of Tajikistan.</p></li>
</ul>
<p>5.2. An individual provides: an identity document; photo and/or video images obtained during verification on the Platform; residential address; email address and phone number; information on tax residency, source of funds and whether the individual is, or is associated with, a politically exposed person (PEP).</p>
<p>5.3. An individual entrepreneur, in addition to the information under clause 5.2, provides a document confirming state registration as an individual entrepreneur.</p>
<p>5.4. A legal entity provides: certificate of state registration; a current extract from the register; constituent documents; documents confirming the authority of the director and representatives (power of attorney); information on the beneficial owners and their identity documents; information on the nature of its business and source of funds; contact details.</p>
<p>5.5. The Company may request additional documents, their notarised copies and translations, carry out re-identification, and independently decides whether to approve or reject the Client's registration or the execution of a specific Instruction.</p>
<p>5.6. The Client must notify the Company of any change in the information provided during identification no later than 5 (five) business days after the change.</p>
<h2 id="en-s6" class="zx-doc-h">6. Personal Data</h2>
<p>6.1. By accepting the offer, a Client who is an individual or an individual entrepreneur consents to the processing of their personal data by the Company in accordance with the Law of the Republic of Tajikistan "On Personal Data Protection". A Client that is a legal entity warrants that it has obtained the consent of its director, representatives and beneficial owners to the processing of their personal data by the Company on the terms of this Section.</p>
<p>6.2. The following data are processed: surname, first name, patronymic; date and place of birth; citizenship; identity document details; photo and video images obtained during verification; residential address; phone number and email address; information on tax residency, source of funds and PEP status; information on transactions and wallet addresses; IP addresses and data of devices used to access the Platform.</p>
<p>6.3. Purposes of processing: conclusion and performance of the Agreement; identification and verification; compliance with AML/CFT/CPF and sanctions legislation; ensuring the security of the Platform; handling enquiries and claims.</p>
<p>6.4. Processing includes the collection, recording, systematisation, accumulation, storage, updating, use, transfer (provision, access), anonymisation, blocking, deletion and destruction of personal data, with or without the use of automation tools.</p>
<p>6.5. The Client consents to the transfer of personal data: to banks and Partner Platforms, to the extent necessary to execute Instructions; to providers of verification, blockchain analytics and technological infrastructure services (including Fireblocks), to the extent necessary for them to provide services to the Company; to Competent Authorities, in cases provided for by law. The Client consents to the cross-border transfer of personal data to such persons, including to states whose legislation may provide a different level of personal data protection.</p>
<p>6.6. Personal data are stored for the term of the Agreement and for at least 5 (five) years after the termination of the relationship with the Client, unless a longer period is established by law.</p>
<p>6.7. The Client may obtain information on the processing of their personal data, request its correction and withdraw consent by sending a written notice to the Company. Withdrawal of consent results in termination of the Agreement in accordance with Section 18. Data whose retention is mandatory under AML/CFT/CPF legislation are stored for the period specified in clause 6.6 regardless of the withdrawal of consent.</p>
<p>6.8. The Company takes legal, organisational and technical measures to protect personal data against unlawful access, alteration, disclosure and destruction.</p>
<h2 id="en-s7" class="zx-doc-h">7. Description of Services</h2>
<p>7.1. The Company provides the following services to Clients:</p>
<ul>
<li><p>purchase of digital assets using the Client's funds;</p></li>
<li><p>sale of the Client's digital assets for funds;</p></li>
<li><p>conversion of one digital asset into another;</p></li>
<li><p>transfer of digital assets and/or funds on the Client's instructions to recipients designated by the Client;</p></li>
<li><p>provision of reports on executed transactions.</p></li>
</ul>
<p>7.2. Transactions are carried out with digital assets and on networks supported by the Fireblocks infrastructure and listed in the List of Supported Digital Assets and Networks on the Platform. The Company may amend this list by notifying Clients via the Platform.</p>
<p>7.3. No limits are set on transaction amounts. The Company may request documents confirming the source of funds for a transaction of any amount.</p>
<h2 id="en-s8" class="zx-doc-h">8. Electronic Document Flow and Access Security</h2>
<p>8.1. Specifications, reports, notices and other documents under the Agreement are executed electronically in the Personal Account.</p>
<p>8.2. Logging into the Personal Account and signing a Specification are confirmed by 2FA: a one-time code sent to the Client's email address and a one-time code sent by SMS to the Client's phone number.</p>
<p>8.3. The Parties acknowledge that actions confirmed by 2FA are performed by the Client, and an electronic document signed in this way is equivalent to a paper document bearing a handwritten signature (for legal entities, signed by an authorised person and sealed, if a seal is used). A Specification is deemed signed by the Company from the moment it is confirmed on the Platform.</p>
<p>8.4. The Client must keep its login credentials confidential and ensure the security of access to its email and phone number. The risk of actions performed using the Client's 2FA lies with the Client. In the event of loss of access or suspected compromise, the Client must immediately notify the Company, which will block access to the Personal Account until security is restored.</p>
<p>8.5. The Platform's electronic logs are recognised by the Parties as proper evidence of the actions of the Client and the Company.</p>
<p>8.6. Notices are sent via the Personal Account and/or to the Client's email address and are deemed received on the day they are sent.</p>
<h2 id="en-s9" class="zx-doc-h">9. Submission and Execution of Instructions. Rate Fixation</h2>
<p>9.1. The Client creates a Specification in the Personal Account indicating the type of transaction, asset, network, amount, currency, recipient details and other terms. The Company confirms the transaction rate, the Commission amount and the amount to be received.</p>
<p>9.2. The rate is fixed from the moment the Client signs the Specification and remains valid until the end of the Banking Day on which the Specification was signed (Dushanbe time). If the Specification is signed on a day that is not a Banking Day, the rate remains valid until the end of the next Banking Day.</p>
<p>9.3. The Client must ensure that 100% of the transaction amount (funds to the Company's bank account or digital assets to the Company Wallet) is received no later than 1 (one) Banking Day after signing the Specification.</p>
<p>9.4. If the funds (assets) are received within the Fixation Period, the transaction is executed at the fixed rate.</p>
<p>9.5. If the funds (assets) are received after the end of the Fixation Period and the Specification has not been cancelled by the Company, the transaction is executed at the current rate at the time of receipt, of which the Company notifies the Client. The risk of rate changes after the end of the Fixation Period lies with the Client.</p>
<p>9.6. If the funds (assets) are not received within the period specified in clause 9.3, the Client shall pay the Company a penalty of 0.5% (zero point five per cent) of the Specification amount for each calendar day of delay, but not more than 10% (ten per cent) of the Specification amount. The Company may cancel the Specification at any time after the expiry of that period. The penalty accrues until the day the funds (assets) are received or the Specification is cancelled and may be deducted by the Company from the funds (assets) received.</p>
<p>9.7. The Company executes the Instruction within the period specified in the Specification or, if no period is specified, within a reasonable time taking into account the nature of the transaction and the operation of the Partner Platforms.</p>
<p>9.8. The Company may refuse to execute or suspend the execution of an Instruction in the event of absence or insufficiency of the Client's funds (assets), detection of signs of a suspicious transaction, a sanctions screening match, or for reasons beyond the Company's control (technical failures of Partner Platforms, banks, payment systems, blockchain networks or the Fireblocks infrastructure).</p>
<p>9.9. The Company provides the Client with a report on the executed transaction in the Personal Account no later than 1 (one) Banking Day after its completion, stating the amount, rate, Commission withheld and third-party costs. If the Client does not raise objections within 3 (three) Banking Days from the date the report is provided, the report is deemed accepted.</p>
<h2 id="en-s10" class="zx-doc-h">10. Refunds</h2>
<p>10.1. In the event of refusal to execute, cancellation of a Specification or impossibility of executing an Instruction, the funds (digital assets) are returned to the Client within 2 (two) Banking Days to the account (address) from which they were received.</p>
<p>10.2. If a refund to the original account (address) is technically impossible, the refund is made to another verified account (address) of the Client on the basis of the Client's written application after the necessary checks.</p>
<p>10.3. The refund is made in the same currency (digital asset) and in the same amount (quantity) as received, less third-party costs actually incurred and any accrued penalty. No Commission is charged for an unexecuted transaction.</p>
<p>10.4. The refund period specified in clause 10.1 does not apply if the funds (assets) are suspended or frozen in accordance with AML/CFT/CPF legislation, sanctions restrictions or at the request of Competent Authorities. In such case, the refund is made after the restrictions are lifted.</p>
<h2 id="en-s11" class="zx-doc-h">11. Commission Fee. Taxes</h2>
<p>11.1. For the execution of Instructions, the Client pays the Company a Commission Fee at the single rate set out in Annex No. 1.</p>
<p>11.2. The Commission Fee is withheld by the Company at the time the transaction is executed from the funds (assets) transferred by the Client for the execution of the Instruction.</p>
<p>11.3. The Company does not charge the Client any fees other than the Commission Fee, the penalty under clause 9.6 and documented third-party costs directly related to the execution of the Instruction (blockchain network fees, fees of banks and Partner Platforms). Such costs are stated in the Specification and/or the report.</p>
<p>11.4. The Company may unilaterally change the Tariffs by notifying Clients at least 10 (ten) calendar days before the changes take effect. Specifications signed before the changes take effect are subject to the previous Tariffs.</p>
<p>11.5. The Commission Fee is final and includes taxes payable by the Company, if applicable. The Client independently fulfils its tax obligations arising in connection with digital asset transactions in accordance with the legislation of its country of tax residence.</p>
<h2 id="en-s12" class="zx-doc-h">12. Rights and Obligations of the Parties</h2>
<p>12.1. The Company shall:</p>
<ul>
<li><p>execute Instructions in good faith and in accordance with the terms of the Specification;</p></li>
<li><p>ensure segregated recording of each Client's funds and digital assets in accordance with Section 4;</p></li>
<li><p>ensure the confidentiality of information about the Client and its transactions;</p></li>
<li><p>provide reports in accordance with clause 9.9;</p></li>
<li><p>inform the Client of the risks of digital asset transactions;</p></li>
<li><p>carry out KYC/AML and sanctions screening procedures;</p></li>
<li><p>select Partner Platforms in accordance with Section 13.</p></li>
</ul>
<p>12.2. The Company may:</p>
<ul>
<li><p>request additional documents and information from the Client;</p></li>
<li><p>refuse registration or the execution of an Instruction without giving reasons, unless this contradicts the legislation of the Republic of Tajikistan;</p></li>
<li><p>suspend transactions and freeze the Client's funds (assets) in accordance with Section 15;</p></li>
<li><p>engage Partner Platforms meeting the requirements of Section 13;</p></li>
<li><p>amend the Tariffs and the terms of the offer in the manner provided for by the Agreement.</p></li>
</ul>
<p>12.3. The Client shall:</p>
<ul>
<li><p>provide accurate documents and information;</p></li>
<li><p>transfer funds and/or digital assets in a timely manner in accordance with the Specification;</p></li>
<li><p>transfer funds only from its own bank accounts and digital assets only from addresses under its control;</p></li>
<li><p>not use the Company's services in the interests of third parties without disclosing this to the Company, nor for the purposes of laundering criminal proceeds, financing terrorism or financing the proliferation of weapons of mass destruction;</p></li>
<li><p>independently verify the accuracy of payment details in accordance with clause 12.4.</p></li>
</ul>
<p>12.4. The Client independently verifies the accuracy of the details specified in the Specification: wallet address, network, tag (memo) and bank details. Blockchain transactions are irreversible. Losses resulting from the Client providing incorrect details, transferring an asset on an unsupported network or transferring an unsupported asset to the Company Wallet are borne by the Client. The Company is not obliged to recover such assets but may, at the Client's request, attempt to return them at the Client's expense.</p>
<p>12.5. The Client confirms that it is aware of the risks of digital asset transactions, including the volatility of their value, the absence of state guarantees for digital assets, the risk of technical failures of blockchain networks and infrastructure, and the possibility of total or partial loss of funds due to circumstances beyond the Company's control.</p>
<h2 id="en-s13" class="zx-doc-h">13. Selection of Partner Platforms</h2>
<p>13.1. The Company engages Partner Platforms that meet the following requirements:</p>
<ul>
<li><p>holding a licence or authorisation for the relevant activity in their jurisdiction, where required by the laws of that jurisdiction;</p></li>
<li><p>having effective KYC/AML and sanctions screening policies and procedures;</p></li>
<li><p>the Partner Platform, its beneficial owners and managers are not on the sanctions lists specified in clause 15.3, and it is not registered in a prohibited jurisdiction;</p></li>
<li><p>a sound business reputation and absence of material adverse information;</p></li>
<li><p>technical reliability and secure storage of assets;</p></li>
<li><p>financial stability.</p></li>
</ul>
<p>13.2. The Company reviews a Partner Platform before commencing cooperation and re-assesses its compliance with the requirements at least once a year, as well as upon receipt of material adverse information. If non-compliance is identified, the Company stops using the Partner Platform for new Instructions.</p>
<p>13.3. Subject to compliance with the requirements of this Section, the Company is not liable for the actions or non-performance of obligations by Partner Platforms.</p>
<h2 id="en-s14" class="zx-doc-h">14. Liability of the Parties</h2>
<p>14.1. For non-performance or improper performance of obligations under the Agreement, the Parties are liable in accordance with the legislation of the Republic of Tajikistan.</p>
<p>14.2. The Company's liability for actual damage caused to the Client is limited to the amount of the Commission Fee actually received for the relevant transaction, except in cases of intent or gross negligence of the Company, as well as loss, through the Company's fault, of funds (assets) held in the Company's accounts and Wallets. For Clients who are individuals, the limitation of liability applies to the extent permitted by the legislation of the Republic of Tajikistan.</p>
<p>14.3. The Company is not liable for:</p>
<ul>
<li><p>losses resulting from changes in digital asset exchange rates, including after the end of the Fixation Period;</p></li>
<li><p>technical failures of banks, payment systems, blockchain networks and the Fireblocks infrastructure that occurred through no fault of the Company;</p></li>
<li><p>actions of Partner Platforms, subject to clause 13.3;</p></li>
<li><p>non-performance of obligations by the Client's counterparties;</p></li>
<li><p>losses resulting from the Client providing incorrect details or compromise of its 2FA;</p></li>
<li><p>consequences of measures taken in accordance with Section 15.</p></li>
</ul>
<p>14.4. The Client is liable for the accuracy of the documents and information provided and for the lawful origin of the funds (assets) transferred, and shall compensate the Company for losses resulting from a breach of these obligations.</p>
<h2 id="en-s15" class="zx-doc-h">15. Anti-Money Laundering. Sanctions Compliance</h2>
<p>15.1. The Company operates in accordance with the legislation of the Republic of Tajikistan on countering the legalisation (laundering) of criminal proceeds, the financing of terrorism and the financing of the proliferation of weapons of mass destruction, taking into account the FATF Recommendations.</p>
<p>15.2. The Company applies the following measures:</p>
<ul>
<li><p>identification and verification of Clients, their representatives and beneficial owners;</p></li>
<li><p>a risk-based approach and enhanced due diligence for high-risk Clients, including PEPs;</p></li>
<li><p>establishing the source of funds and, where necessary, the source of wealth;</p></li>
<li><p>ongoing transaction monitoring;</p></li>
<li><p>screening of addresses and transactions using KYT tools;</p></li>
<li><p>collecting and transmitting originator and beneficiary information for digital asset transfers (Travel Rule), where applicable;</p></li>
<li><p>retaining information and documents for at least 5 (five) years after the termination of the relationship with the Client.</p></li>
</ul>
<p>15.3. Clients, their representatives, beneficial owners and recipients of funds are screened at onboarding and on an ongoing basis against:</p>
<ul>
<li><p>lists of persons involved in terrorist activities and the financing of the proliferation of weapons of mass destruction maintained under the legislation of the Republic of Tajikistan;</p></li>
<li><p>the UN Security Council sanctions lists;</p></li>
<li><p>the sanctions lists of the Office of Foreign Assets Control of the U.S. Department of the Treasury (OFAC), including the SDN list;</p></li>
<li><p>the LSEG World-Check database, including PEP and adverse media data.</p></li>
</ul>
<p>15.4. The Company does not serve persons registered, resident or located in the following jurisdictions and does not carry out transactions connected with them:</p>
<ul>
<li><p>jurisdictions subject to a FATF call for countermeasures;</p></li>
<li><p>states and territories subject to comprehensive UN or OFAC sanctions;</p></li>
<li><p>states and territories with elevated terrorist activity.</p></li>
</ul>
<p>The current List of Prohibited Jurisdictions is published on the Platform. Enhanced due diligence is applied to persons from jurisdictions under increased FATF monitoring.</p>
<p>15.5. The Company does not accept or execute transactions with funds (assets) connected with: mixing services (mixers); darknet markets; fraud, theft and hacks; ransomware; illegal gambling; terrorist financing; addresses and persons on sanctions lists. Funds from third parties (not from the Client's own accounts) are not accepted and are returned to the sender.</p>
<p>15.6. Upon detection of signs of a suspicious transaction, a sanctions list match, failure to provide requested documents, or at the request of Competent Authorities, the Company may: refuse to carry out a transaction; suspend a transaction; freeze funds (assets); report to the Competent Authority; terminate the Agreement in accordance with clause 18.3. The Company does not notify the Client of the transmission of information to Competent Authorities where prohibited by law.</p>
<p>15.7. Measures taken by the Company in accordance with this Section do not constitute a breach of the Agreement, and the Company does not compensate the Client for losses associated with their application.</p>
<h2 id="en-s16" class="zx-doc-h">16. Confidentiality</h2>
<p>16.1. The Company ensures the confidentiality of information about the Client and its transactions and does not disclose it to third parties, except in cases provided for by the legislation of the Republic of Tajikistan and the Agreement (including clause 6.5).</p>
<p>16.2. The Company may disclose information about the Client to Competent Authorities upon their lawful request and in cases provided for by law.</p>
<h2 id="en-s17" class="zx-doc-h">17. Force Majeure</h2>
<p>17.1. The Parties are released from liability for non-performance of obligations if it results from force majeure circumstances (natural disasters, military operations, the imposition of sanctions, changes in legislation, global technical failures and other circumstances beyond the Parties' control) arising after the conclusion of the Agreement.</p>
<p>17.2. The Party affected by such circumstances shall notify the other Party within 5 (five) business days. If the circumstances continue for more than 30 (thirty) calendar days, either Party may terminate the Agreement.</p>
<h2 id="en-s18" class="zx-doc-h">18. Term and Termination of the Agreement</h2>
<p>18.1. The Agreement enters into force upon acceptance of the offer and is concluded for an indefinite term.</p>
<p>18.2. Either Party may terminate the Agreement by giving the other Party at least 10 (ten) calendar days' notice, provided that all previously signed Specifications have been completed.</p>
<p>18.3. The Company may terminate the Agreement unilaterally without prior notice, from the date a notice is sent to the Client, in the following cases:</p>
<ul>
<li><p>a match of the Client, its representative or beneficial owner against the sanctions lists specified in clause 15.3;</p></li>
<li><p>identification of a connection between the Client and a prohibited jurisdiction;</p></li>
<li><p>identification of signs of money laundering, terrorist financing or other breaches of AML/CFT/CPF legislation;</p></li>
<li><p>failure to provide requested documents or provision of false information;</p></li>
<li><p>a request of the Competent Authorities.</p></li>
</ul>
<p>18.4. Upon termination of the Agreement, the Client's funds (assets) are returned in accordance with Section 10, except for funds (assets) frozen in accordance with Section 15.</p>
<p>18.5. Termination of the Agreement does not release the Parties from obligations that arose before its termination.</p>
<h2 id="en-s19" class="zx-doc-h">19. Amendment of the Offer</h2>
<p>19.1. The Company may unilaterally amend the terms of the offer by publishing a new version on the Platform and notifying Clients.</p>
<p>19.2. Amendments take effect 10 (ten) calendar days after publication, unless another period is specified in the notice, and do not apply to Specifications signed before the amendments take effect. Amendments required by law may take effect from the date of publication.</p>
<h2 id="en-s20" class="zx-doc-h">20. Claims Procedure and Dispute Resolution</h2>
<p>20.1. The relations of the Parties are governed by the legislation of the Republic of Tajikistan.</p>
<p>20.2. Compliance with the claims procedure is mandatory. A claim is sent in writing to the Company's email address specified in the "Company Details" section and must contain a description of the claim, its grounds and supporting documents.</p>
<p>20.3. The Company considers a claim within 15 (fifteen) business days from the date of its receipt. If additional information is required, this period may be extended to 30 (thirty) calendar days with notice to the Client.</p>
<p>20.4. If a dispute is not settled through the claims procedure, it shall be referred to the court at the Company's location, unless a different jurisdiction is established by the legislation of the Republic of Tajikistan, including consumer protection legislation.</p>
<h2 id="en-s21" class="zx-doc-h">21. Final Provisions</h2>
<p>21.1. If any provision of the offer is found invalid, this does not affect the validity of the remaining provisions.</p>
<p>21.2. For all questions related to the offer, the Client may contact the Company using the contact details specified in the "Company Details" section.</p>
<p>21.3. This offer is made in Russian, English and Tajik. In the event of any discrepancy between the texts, the Russian text prevails.</p>

<h2 id="ru-s1" class="zx-doc-h">1. Общие положения</h2>
<p>1.1. Настоящий документ является публичной офертой Общества с ограниченной ответственностью «ЗАМ РИВОЧ» (ЧДММ «ЗАМ РИВОЧ»), зарегистрированного в соответствии с законодательством Республики Таджикистан (далее — «Компания»), адресованной неопределённому кругу физических лиц, индивидуальных предпринимателей и юридических лиц, и содержит все существенные условия договора комиссии на совершение операций с цифровыми активами (далее — «Договор»).</p>
<p>1.2. Компания является резидентом IT Park (г. Душанбе) (свидетельство резидента № ХХХХ от ХХ.ХХ.20ХХ г.) и осуществляет деятельность в сфере цифровых активов и блокчейн-технологий в рамках видов деятельности, разрешённых резидентам IT Park.</p>
<p>1.3. Услуги оказываются посредством электронной платформы ZAMEX (далее — «Платформа»), доступной по адресу: zamex.tj. ZAMEX является коммерческим обозначением Платформы Компании.</p>
<p>1.4. Компания оказывает услуги внебиржевого (OTC) обмена цифровых активов: по поручению Клиента совершает от своего имени, но за счёт Клиента сделки по покупке, продаже, конвертации и переводу цифровых активов. Компания не организует торги с сопоставлением заявок Клиентов между собой, не принимает денежные средства во вклады и не использует средства и активы Клиентов для собственной торговой деятельности.</p>
<p>1.5. Акцептом настоящей оферты является проставление Клиентом отметки о согласии с условиями оферты при регистрации на Платформе. С момента акцепта Договор считается заключённым, а Клиент — полностью и безоговорочно согласившимся со всеми условиями оферты и приложений к ней. Договор, заключённый путём акцепта, считается заключённым в письменной форме.</p>
<p>1.6. Неотъемлемой частью оферты является Приложение № 1 «Тарифы». Перечень поддерживаемых цифровых активов и сетей, а также Перечень запрещённых юрисдикций публикуются на Платформе и являются частью Договора.</p>
<h2 id="ru-s2" class="zx-doc-h">2. Термины и определения</h2>
<p><strong>Компания (Комиссионер)</strong> — ООО «ЗАМ РИВОЧ» (ЧДММ «ЗАМ РИВОЧ»), юридическое лицо, зарегистрированное по законодательству Республики Таджикистан.</p>
<p><strong>Клиент (Комитент)</strong> — полностью дееспособное физическое лицо, достигшее 18 лет, индивидуальный предприниматель или юридическое лицо, в том числе нерезидент Республики Таджикистан, акцептовавшие настоящую оферту и прошедшие идентификацию.</p>
<p><strong>Платформа (ZAMEX)</strong> — программно-технический комплекс Компании, через который Клиент регистрируется, проходит идентификацию, формирует и подписывает Спецификации и получает отчёты.</p>
<p><strong>Личный кабинет</strong> — персональный раздел Клиента на Платформе, содержащий сведения о Клиенте, Спецификациях, операциях и отчётах.</p>
<p><strong>Цифровые активы</strong> — цифровые активы, созданные и учитываемые в распределённой информационной системе на основе технологии блокчейн.</p>
<p><strong>Поручение (Спецификация)</strong> — электронный документ, сформированный в Личном кабинете и подписанный Сторонами в порядке раздела 8, содержащий вид операции, актив, сеть, сумму, валюту, курс, размер комиссии, реквизиты и иные условия конкретной операции.</p>
<p><strong>Период фиксации</strong> — период с момента подписания Клиентом Спецификации до окончания Банковского дня, в который она подписана (по времени г. Душанбе), в течение которого действует зафиксированный в Спецификации курс.</p>
<p><strong>Fireblocks</strong> — технологическая инфраструктура для хранения и перевода цифровых активов, основанная на технологии многосторонних вычислений (MPC), используемая Компанией.</p>
<p><strong>Кошелёк Компании</strong> — адрес (кошелёк, субсчёт) Компании в инфраструктуре Fireblocks, на который Клиент перечисляет цифровые активы для исполнения Спецификации.</p>
<p><strong>Партнёрские площадки</strong> — банки, платёжные системы, крипто-биржи, операторы и провайдеры ликвидности цифровых активов, через которых Компания исполняет Поручения Клиента.</p>
<p><strong>Тарифы</strong> — размер Комиссионного вознаграждения, установленный в Приложении № 1.</p>
<p><strong>Комиссионное вознаграждение (Комиссия)</strong> — вознаграждение Компании за исполнение Поручения в размере, установленном Тарифами.</p>
<p><strong>2FA</strong> — двухфакторная аутентификация Клиента с использованием одноразовых кодов, направляемых на адрес электронной почты и на номер телефона Клиента.</p>
<p><strong>Банковский день</strong> — день, в который банки Республики Таджикистан открыты для проведения операций.</p>
<p><strong>KYC/AML</strong> — процедуры надлежащей проверки клиента и противодействия легализации (отмыванию) доходов, полученных преступным путём, финансированию терроризма и финансированию распространения оружия массового уничтожения (ПОД/ФТ/ФРОМУ).</p>
<p><strong>KYT</strong> — проверка адресов и транзакций в блокчейне с использованием средств блокчейн-аналитики.</p>
<p><strong>Уполномоченные органы</strong> — государственные органы Республики Таджикистан, осуществляющие контроль и надзор в сфере ПОД/ФТ/ФРОМУ, а также иные органы, которым Компания обязана предоставлять сведения в случаях, предусмотренных законодательством.</p>
<h2 id="ru-s3" class="zx-doc-h">3. Предмет Договора и характер услуг</h2>
<p>3.1. По Договору Компания (комиссионер) обязуется по поручению Клиента (комитента) за вознаграждение совершать от своего имени, но за счёт Клиента сделки с цифровыми активами и денежными средствами, указанные в Спецификации.</p>
<p>3.2. По сделкам, совершённым Компанией с третьими лицами во исполнение Поручения, права и обязанности приобретает Компания. Денежные средства и цифровые активы, поступившие к Компании от Клиента, а также полученные Компанией за счёт Клиента, являются собственностью Клиента и подлежат передаче Клиенту в порядке, установленном Договором.</p>
<p>3.3. Единственным доходом Компании по Договору является Комиссионное вознаграждение по Тарифам. Компания не получает дохода от разницы курсов (спреда). Курс конвертации определяется банками и Партнёрскими площадками; маржа (спред), включённая ими в курс, является их доходом и не является доходом Компании.</p>
<p>3.4. Компания не принимает от Клиента ручательства за исполнение сделок третьими лицами (делькредере) и не отвечает за их неисполнение, за исключением случаев, когда Компания не проявила необходимой осмотрительности при выборе Партнёрской площадки (раздел 13).</p>
<h2 id="ru-s4" class="zx-doc-h">4. Хранение цифровых активов и денежных средств</h2>
<p>4.1. Цифровые активы, поступившие от Клиента для исполнения Поручения, учитываются на отдельных (сегрегированных) кошельках или субсчетах, открытых Компанией в инфраструктуре Fireblocks. Технология MPC исключает хранение приватного ключа целиком в одном месте и снижает риск несанкционированного доступа.</p>
<p>4.2. Денежные средства Клиента поступают на банковские счета Компании и учитываются отдельно по каждому Клиенту во внутреннем учёте Компании.</p>
<p>4.3. Денежные средства и цифровые активы Клиента находятся у Компании транзитно — исключительно на период, необходимый для исполнения конкретного Поручения, — и перечисляются Клиенту или указанному им получателю в срок, указанный в Спецификации, а если срок не указан — не позднее 1 (одного) Банковского дня с момента завершения операции.</p>
<p>4.4. Компания не использует денежные средства и цифровые активы Клиента в собственных интересах, не передаёт их в залог, заём или доверительное управление и не смешивает их с собственными активами.</p>
<p>4.5. Компания не осуществляет длительного (депозитарного) хранения цифровых активов Клиента и не начисляет на них проценты или иной доход.</p>
<h2 id="ru-s5" class="zx-doc-h">5. Требования к Клиентам. Идентификация</h2>
<p>5.1. Услуги предоставляются:</p>
<ul>
<li><p>физическим лицам, достигшим 18 лет, полностью дееспособным, действующим от своего имени и в своих интересах;</p></li>
<li><p>индивидуальным предпринимателям;</p></li>
<li><p>юридическим лицам — резидентам и нерезидентам Республики Таджикистан.</p></li>
</ul>
<p>5.2. Физическое лицо предоставляет: документ, удостоверяющий личность; фото- и (или) видеоизображение, полученное при прохождении верификации на Платформе; адрес места жительства; адрес электронной почты и номер телефона; сведения о налоговом резидентстве, об источнике средств и о наличии статуса публичного должностного лица (ПДЛ) или связи с ним.</p>
<p>5.3. Индивидуальный предприниматель дополнительно к сведениям по п. 5.2 предоставляет документ о государственной регистрации в качестве индивидуального предпринимателя.</p>
<p>5.4. Юридическое лицо предоставляет: свидетельство о государственной регистрации; актуальную выписку из реестра; учредительные документы; документы о полномочиях руководителя и представителей (доверенность); сведения о бенефициарных владельцах и документы, удостоверяющие их личность; сведения о характере деятельности и об источнике средств; контактные данные.</p>
<p>5.5. Компания вправе запрашивать дополнительные документы, их нотариально заверенные копии и переводы, проводить повторную идентификацию и самостоятельно принимает решение об одобрении или отклонении регистрации Клиента либо исполнения конкретного Поручения.</p>
<p>5.6. Клиент обязан уведомлять Компанию об изменении сведений, предоставленных при идентификации, не позднее 5 (пяти) рабочих дней с даты изменения.</p>
<h2 id="ru-s6" class="zx-doc-h">6. Персональные данные</h2>
<p>6.1. Акцептуя оферту, Клиент — физическое лицо или индивидуальный предприниматель — даёт Компании согласие на обработку своих персональных данных в соответствии с Законом Республики Таджикистан «О защите персональных данных». Клиент — юридическое лицо гарантирует, что получил согласие своих руководителя, представителей и бенефициарных владельцев на обработку их персональных данных Компанией на условиях настоящего раздела.</p>
<p>6.2. Обрабатываются следующие данные: фамилия, имя, отчество; дата и место рождения; гражданство; реквизиты документа, удостоверяющего личность; фото- и видеоизображение, полученное при верификации; адрес места жительства; номер телефона и адрес электронной почты; сведения о налоговом резидентстве, об источнике средств и о статусе ПДЛ; сведения об операциях и адресах кошельков; IP-адреса и данные устройств, используемых для доступа к Платформе.</p>
<p>6.3. Цели обработки: заключение и исполнение Договора; идентификация и верификация; выполнение требований законодательства в сфере ПОД/ФТ/ФРОМУ и санкционного контроля; обеспечение безопасности Платформы; рассмотрение обращений и претензий.</p>
<p>6.4. Обработка включает сбор, запись, систематизацию, накопление, хранение, уточнение, использование, передачу (предоставление, доступ), обезличивание, блокирование, удаление и уничтожение персональных данных, с использованием средств автоматизации и без них.</p>
<p>6.5. Клиент соглашается на передачу персональных данных: банкам и Партнёрским площадкам — в объёме, необходимом для исполнения Поручений; провайдерам услуг верификации, блокчейн-аналитики и технологической инфраструктуры (в том числе Fireblocks) — в объёме, необходимом для оказания ими услуг Компании; Уполномоченным органам — в случаях, предусмотренных законодательством. Клиент соглашается на трансграничную передачу персональных данных указанным лицам, в том числе в государства, законодательство которых может обеспечивать иной уровень защиты персональных данных.</p>
<p>6.6. Персональные данные хранятся в течение срока действия Договора и не менее 5 (пяти) лет после прекращения отношений с Клиентом, если более длительный срок не установлен законодательством.</p>
<p>6.7. Клиент вправе получать сведения об обработке своих персональных данных, требовать их уточнения и отозвать согласие, направив письменное уведомление Компании. Отзыв согласия влечёт прекращение Договора в порядке раздела 18. Данные, хранение которых обязательно в соответствии с законодательством в сфере ПОД/ФТ/ФРОМУ, хранятся в течение срока, указанного в п. 6.6, независимо от отзыва согласия.</p>
<p>6.8. Компания принимает правовые, организационные и технические меры для защиты персональных данных от неправомерного доступа, изменения, раскрытия и уничтожения.</p>
<h2 id="ru-s7" class="zx-doc-h">7. Описание услуг</h2>
<p>7.1. Компания оказывает Клиентам следующие услуги:</p>
<ul>
<li><p>приобретение цифровых активов за счёт денежных средств Клиента;</p></li>
<li><p>продажа цифровых активов Клиента за денежные средства;</p></li>
<li><p>конвертация одних цифровых активов в другие;</p></li>
<li><p>перевод цифровых активов и (или) денежных средств по поручению Клиента указанным им получателям;</p></li>
<li><p>предоставление отчётов об исполненных операциях.</p></li>
</ul>
<p>7.2. Операции совершаются с цифровыми активами и в сетях, поддерживаемых инфраструктурой Fireblocks и указанных в Перечне поддерживаемых цифровых активов и сетей на Платформе. Компания вправе изменять указанный перечень с уведомлением Клиентов через Платформу.</p>
<p>7.3. Лимиты на сумму операций не устанавливаются. Компания вправе при любой сумме операции запросить документы, подтверждающие источник средств.</p>
<h2 id="ru-s8" class="zx-doc-h">8. Электронный документооборот и безопасность доступа</h2>
<p>8.1. Спецификации, отчёты, уведомления и иные документы по Договору оформляются в электронном виде в Личном кабинете.</p>
<p>8.2. Вход в Личный кабинет и подписание Спецификации подтверждаются 2FA: одноразовым кодом, направленным на адрес электронной почты Клиента, и одноразовым кодом, направленным по SMS на номер телефона Клиента.</p>
<p>8.3. Стороны признают, что действия, подтверждённые 2FA, совершены Клиентом, а электронный документ, подписанный таким образом, равнозначен документу на бумажном носителе, подписанному собственноручно (для юридических лиц — подписанному уполномоченным лицом и скреплённому печатью при её наличии). Спецификация считается подписанной Компанией с момента её подтверждения на Платформе.</p>
<p>8.4. Клиент обязан обеспечивать конфиденциальность учётных данных и безопасность доступа к своей электронной почте и номеру телефона. Риск действий, совершённых с использованием 2FA Клиента, несёт Клиент. При утрате доступа или подозрении на компрометацию Клиент обязан незамедлительно уведомить Компанию, которая блокирует доступ к Личному кабинету до восстановления безопасности.</p>
<p>8.5. Электронные журналы (логи) Платформы признаются Сторонами надлежащим доказательством действий Клиента и Компании.</p>
<p>8.6. Уведомления направляются через Личный кабинет и (или) на адрес электронной почты Клиента и считаются полученными в день их направления.</p>
<h2 id="ru-s9" class="zx-doc-h">9. Порядок подачи и исполнения Поручений. Фиксация курса</h2>
<p>9.1. Клиент формирует Спецификацию в Личном кабинете с указанием вида операции, актива, сети, суммы, валюты, реквизитов получателя и иных условий. Компания подтверждает курс операции, сумму Комиссии и сумму к получению.</p>
<p>9.2. Курс фиксируется с момента подписания Клиентом Спецификации и действует до окончания Банковского дня, в который Спецификация подписана (по времени г. Душанбе). Если Спецификация подписана в день, не являющийся Банковским днём, курс действует до окончания ближайшего следующего Банковского дня.</p>
<p>9.3. Клиент обязан обеспечить поступление 100% суммы операции — денежных средств на банковский счёт Компании или цифровых активов на Кошелёк Компании — не позднее 1 (одного) Банковского дня с момента подписания Спецификации.</p>
<p>9.4. Если средства (активы) поступили в течение Периода фиксации, операция исполняется по зафиксированному курсу.</p>
<p>9.5. Если средства (активы) поступили после окончания Периода фиксации и Спецификация не аннулирована Компанией, операция исполняется по текущему курсу на момент поступления, о котором Компания уведомляет Клиента. Риск изменения курса после окончания Периода фиксации несёт Клиент.</p>
<p>9.6. В случае непоступления средств (активов) в срок, указанный в п. 9.3, Клиент уплачивает Компании неустойку (штраф) в размере 0,5% (ноль целых пять десятых процента) от суммы Спецификации за каждый календарный день просрочки, но не более 10% (десяти процентов) от суммы Спецификации. Компания вправе в любой момент после истечения указанного срока аннулировать Спецификацию. Неустойка начисляется до дня поступления средств (активов) либо до дня аннулирования Спецификации и может быть удержана Компанией из поступивших средств (активов).</p>
<p>9.7. Компания исполняет Поручение в срок, указанный в Спецификации, а если срок не указан — в разумный срок с учётом характера операции и работы Партнёрских площадок.</p>
<p>9.8. Компания вправе отказаться от исполнения Поручения или приостановить его исполнение в случае отсутствия или недостаточности средств (активов) Клиента, выявления признаков подозрительной операции, срабатывания санкционного скрининга, а также по причинам, не зависящим от Компании (технические сбои Партнёрских площадок, банков, платёжных систем, блокчейн-сетей, инфраструктуры Fireblocks).</p>
<p>9.9. Компания предоставляет Клиенту отчёт об исполненной операции в Личном кабинете не позднее 1 (одного) Банковского дня после её завершения с указанием суммы, курса, удержанной Комиссии и расходов третьих лиц. Если Клиент не направил возражения в течение 3 (трёх) Банковских дней с даты предоставления отчёта, отчёт считается принятым.</p>
<h2 id="ru-s10" class="zx-doc-h">10. Возврат средств</h2>
<p>10.1. В случае отказа от исполнения, аннулирования Спецификации или невозможности исполнения Поручения денежные средства (цифровые активы) возвращаются Клиенту в течение 2 (двух) Банковских дней на счёт (адрес), с которого они поступили.</p>
<p>10.2. Если возврат на исходный счёт (адрес) технически невозможен, возврат осуществляется на иной верифицированный счёт (адрес) Клиента на основании его письменного заявления после проведения необходимых проверок.</p>
<p>10.3. Возврат осуществляется в той же валюте (том же цифровом активе) и в той же сумме (количестве), в которых средства (активы) поступили, за вычетом фактически понесённых расходов третьих лиц и начисленной неустойки. Комиссия за неисполненную операцию не взимается.</p>
<p>10.4. Срок возврата, указанный в п. 10.1, не применяется, если средства (активы) приостановлены или заморожены в соответствии с законодательством в сфере ПОД/ФТ/ФРОМУ, санкционными ограничениями или по требованию Уполномоченных органов. В этом случае возврат производится после снятия ограничений.</p>
<h2 id="ru-s11" class="zx-doc-h">11. Комиссионное вознаграждение. Налоги</h2>
<p>11.1. За исполнение Поручений Клиент выплачивает Компании Комиссионное вознаграждение по единому тарифу, установленному Приложением № 1.</p>
<p>11.2. Комиссионное вознаграждение удерживается Компанией в момент исполнения операции из суммы средств (активов), переданных Клиентом для исполнения Поручения.</p>
<p>11.3. Компания не взимает с Клиента иных сборов, кроме Комиссионного вознаграждения, неустойки по п. 9.6 и документально подтверждённых расходов третьих лиц, прямо связанных с исполнением Поручения (сетевые комиссии блокчейна, комиссии банков и Партнёрских площадок). Такие расходы указываются в Спецификации и (или) отчёте.</p>
<p>11.4. Компания вправе изменить Тарифы в одностороннем порядке, уведомив Клиентов не менее чем за 10 (десять) календарных дней до вступления изменений в силу. К Спецификациям, подписанным до вступления изменений в силу, применяются прежние Тарифы.</p>
<p>11.5. Комиссионное вознаграждение является окончательным и включает налоги, подлежащие уплате Компанией, если они применимы. Клиент самостоятельно исполняет налоговые обязательства, возникающие у него в связи с операциями с цифровыми активами, в соответствии с законодательством страны своего налогового резидентства.</p>
<h2 id="ru-s12" class="zx-doc-h">12. Права и обязанности Сторон</h2>
<p>12.1. Компания обязана:</p>
<ul>
<li><p>исполнять Поручения добросовестно и в соответствии с условиями Спецификации;</p></li>
<li><p>обеспечивать сегрегированный учёт средств и цифровых активов каждого Клиента в соответствии с разделом 4;</p></li>
<li><p>обеспечивать конфиденциальность сведений о Клиенте и его операциях;</p></li>
<li><p>предоставлять отчёты в соответствии с п. 9.9;</p></li>
<li><p>информировать Клиента о рисках операций с цифровыми активами;</p></li>
<li><p>проводить процедуры KYC/AML и санкционного контроля;</p></li>
<li><p>выбирать Партнёрские площадки в соответствии с разделом 13.</p></li>
</ul>
<p>12.2. Компания вправе:</p>
<ul>
<li><p>запрашивать у Клиента дополнительные документы и сведения;</p></li>
<li><p>отказать в регистрации или исполнении Поручения без объяснения причин, если это не противоречит законодательству Республики Таджикистан;</p></li>
<li><p>приостанавливать операции и замораживать средства (активы) Клиента в соответствии с разделом 15;</p></li>
<li><p>привлекать Партнёрские площадки, соответствующие требованиям раздела 13;</p></li>
<li><p>изменять Тарифы и условия оферты в порядке, предусмотренном Договором.</p></li>
</ul>
<p>12.3. Клиент обязан:</p>
<ul>
<li><p>предоставлять достоверные документы и сведения;</p></li>
<li><p>своевременно перечислять денежные средства и (или) цифровые активы в соответствии со Спецификацией;</p></li>
<li><p>перечислять денежные средства только со своих собственных банковских счетов, а цифровые активы — только с адресов, находящихся под его контролем;</p></li>
<li><p>не использовать услуги Компании в интересах третьих лиц без раскрытия этого Компании, а также в целях легализации преступных доходов, финансирования терроризма или финансирования распространения оружия массового уничтожения;</p></li>
<li><p>самостоятельно проверять правильность реквизитов в соответствии с п. 12.4.</p></li>
</ul>
<p>12.4. Клиент самостоятельно проверяет правильность указанных в Спецификации реквизитов: адреса кошелька, сети, тега (memo) и банковских реквизитов. Операции в блокчейне необратимы. Убытки, возникшие вследствие указания Клиентом неверных реквизитов, перечисления актива в неподдерживаемой сети или перечисления неподдерживаемого актива на Кошелёк Компании, несёт Клиент. Компания не обязана восстанавливать такие активы, но вправе по заявлению Клиента предпринять попытку их возврата за счёт Клиента.</p>
<p>12.5. Клиент подтверждает, что ознакомлен с рисками операций с цифровыми активами, в том числе с риском волатильности их стоимости, отсутствием государственного обеспечения цифровых активов, риском технических сбоев блокчейн-сетей и инфраструктуры, а также возможностью полной или частичной потери средств вследствие обстоятельств, не зависящих от Компании.</p>
<h2 id="ru-s13" class="zx-doc-h">13. Выбор Партнёрских площадок</h2>
<p>13.1. Компания привлекает Партнёрские площадки, соответствующие следующим требованиям:</p>
<ul>
<li><p>наличие лицензии или разрешения на соответствующую деятельность в своей юрисдикции, если такое требование установлено законодательством этой юрисдикции;</p></li>
<li><p>наличие действующих политик и процедур KYC/AML и санкционного контроля;</p></li>
<li><p>отсутствие Партнёрской площадки, её бенефициарных владельцев и руководителей в санкционных списках, указанных в п. 15.3, и регистрация вне запрещённых юрисдикций;</p></li>
<li><p>надёжная деловая репутация и отсутствие существенной негативной информации;</p></li>
<li><p>техническая надёжность и безопасность хранения активов;</p></li>
<li><p>финансовая устойчивость.</p></li>
</ul>
<p>13.2. Компания проводит проверку Партнёрской площадки до начала сотрудничества и пересматривает её соответствие требованиям не реже одного раза в год, а также при получении существенной негативной информации. При выявлении несоответствия Компания прекращает использование Партнёрской площадки для новых Поручений.</p>
<p>13.3. При соблюдении требований настоящего раздела Компания не несёт ответственности за действия и неисполнение обязательств Партнёрскими площадками.</p>
<h2 id="ru-s14" class="zx-doc-h">14. Ответственность Сторон</h2>
<p>14.1. За неисполнение или ненадлежащее исполнение обязательств по Договору Стороны несут ответственность в соответствии с законодательством Республики Таджикистан.</p>
<p>14.2. Ответственность Компании за реальный ущерб, причинённый Клиенту, ограничивается суммой Комиссионного вознаграждения, фактически полученного по соответствующей операции, за исключением случаев умысла или грубой неосторожности Компании, а также утраты по вине Компании средств (активов), находящихся на счетах и Кошельках Компании. В отношении Клиентов — физических лиц ограничение ответственности применяется в той мере, в какой это допускается законодательством Республики Таджикистан.</p>
<p>14.3. Компания не несёт ответственности за:</p>
<ul>
<li><p>убытки, возникшие в результате изменения курсов цифровых активов, в том числе после окончания Периода фиксации;</p></li>
<li><p>технические сбои банков, платёжных систем, блокчейн-сетей и инфраструктуры Fireblocks, возникшие не по вине Компании;</p></li>
<li><p>действия Партнёрских площадок с учётом п. 13.3;</p></li>
<li><p>неисполнение обязательств контрагентами Клиента;</p></li>
<li><p>убытки вследствие указания Клиентом неверных реквизитов или компрометации его 2FA;</p></li>
<li><p>последствия мер, принятых в соответствии с разделом 15.</p></li>
</ul>
<p>14.4. Клиент несёт ответственность за достоверность предоставленных документов и сведений, за законность происхождения переданных средств (активов) и возмещает Компании убытки, возникшие вследствие нарушения им настоящих обязанностей.</p>
<h2 id="ru-s15" class="zx-doc-h">15. Противодействие легализации преступных доходов. Санкционный контроль</h2>
<p>15.1. Компания осуществляет деятельность в соответствии с законодательством Республики Таджикистан о противодействии легализации (отмыванию) доходов, полученных преступным путём, финансированию терроризма и финансированию распространения оружия массового уничтожения, а также с учётом рекомендаций ФАТФ.</p>
<p>15.2. Компания применяет следующие меры:</p>
<ul>
<li><p>идентификация и верификация Клиентов, их представителей и бенефициарных владельцев;</p></li>
<li><p>риск-ориентированный подход и углублённая проверка Клиентов высокого риска, в том числе ПДЛ;</p></li>
<li><p>установление источника средств и, при необходимости, источника благосостояния;</p></li>
<li><p>мониторинг операций на постоянной основе;</p></li>
<li><p>проверка адресов и транзакций средствами KYT;</p></li>
<li><p>сбор и передача сведений об отправителе и получателе при переводах цифровых активов (Travel Rule) в случаях, когда это применимо;</p></li>
<li><p>хранение сведений и документов не менее 5 (пяти) лет после прекращения отношений с Клиентом.</p></li>
</ul>
<p>15.3. Клиенты, их представители, бенефициарные владельцы и получатели средств проверяются при установлении отношений и на постоянной основе по:</p>
<ul>
<li><p>перечням лиц, причастных к террористической деятельности и финансированию распространения оружия массового уничтожения, в соответствии с законодательством Республики Таджикистан;</p></li>
<li><p>санкционным перечням Совета Безопасности ООН;</p></li>
<li><p>санкционным спискам Управления по контролю за иностранными активами Министерства финансов США (OFAC), включая список SDN;</p></li>
<li><p>базе данных LSEG World-Check, в том числе в части ПДЛ и негативной информации.</p></li>
</ul>
<p>15.4. Компания не обслуживает лиц, зарегистрированных, проживающих или находящихся в следующих юрисдикциях, и не проводит операции, связанные с ними:</p>
<ul>
<li><p>юрисдикции, в отношении которых ФАТФ призывает применять контрмеры;</p></li>
<li><p>государства и территории, в отношении которых действуют всеобъемлющие санкции ООН или OFAC;</p></li>
<li><p>государства и территории с повышенной террористической активностью.</p></li>
</ul>
<p>Актуальный Перечень запрещённых юрисдикций публикуется на Платформе. В отношении лиц из юрисдикций, находящихся под усиленным мониторингом ФАТФ, применяется углублённая проверка.</p>
<p>15.5. Компания не принимает и не исполняет операции со средствами (активами), связанными с: сервисами смешивания (миксерами); даркнет-рынками; мошенничеством, хищениями и взломами; программами-вымогателями; незаконной игорной деятельностью; финансированием терроризма; адресами и лицами из санкционных списков. Денежные средства от третьих лиц (не с собственных счетов Клиента) не принимаются и возвращаются отправителю.</p>
<p>15.6. При выявлении признаков подозрительной операции, совпадения по санкционным спискам, непредоставлении запрошенных документов или по требованию Уполномоченных органов Компания вправе: отказать в проведении операции; приостановить операцию; заморозить средства (активы); сообщить в Уполномоченный орган; расторгнуть Договор в соответствии с п. 18.3. Компания не уведомляет Клиента о передаче сведений в Уполномоченные органы, если это запрещено законодательством.</p>
<p>15.7. Меры, принятые Компанией в соответствии с настоящим разделом, не являются нарушением Договора, и Компания не возмещает Клиенту убытки, связанные с их применением.</p>
<h2 id="ru-s16" class="zx-doc-h">16. Конфиденциальность</h2>
<p>16.1. Компания обеспечивает конфиденциальность сведений о Клиенте и его операциях и не раскрывает их третьим лицам, за исключением случаев, предусмотренных законодательством Республики Таджикистан и Договором (в том числе п. 6.5).</p>
<p>16.2. Компания вправе раскрывать сведения о Клиенте Уполномоченным органам по их законному запросу и в случаях, предусмотренных законодательством.</p>
<h2 id="ru-s17" class="zx-doc-h">17. Обстоятельства непреодолимой силы</h2>
<p>17.1. Стороны освобождаются от ответственности за неисполнение обязательств, если оно явилось следствием обстоятельств непреодолимой силы (стихийные бедствия, военные действия, введение санкций, изменения законодательства, технические сбои глобального характера и иные обстоятельства, не зависящие от Сторон), возникших после заключения Договора.</p>
<p>17.2. Сторона, для которой наступили такие обстоятельства, уведомляет другую Сторону в течение 5 (пяти) рабочих дней. Если обстоятельства действуют более 30 (тридцати) календарных дней, каждая из Сторон вправе расторгнуть Договор.</p>
<h2 id="ru-s18" class="zx-doc-h">18. Срок действия и расторжение Договора</h2>
<p>18.1. Договор вступает в силу с момента акцепта оферты и заключается на неопределённый срок.</p>
<p>18.2. Каждая из Сторон вправе расторгнуть Договор, уведомив другую Сторону не менее чем за 10 (десять) календарных дней, при условии завершения всех ранее подписанных Спецификаций.</p>
<p>18.3. Компания вправе расторгнуть Договор в одностороннем порядке без предварительного уведомления, с даты направления уведомления Клиенту, в случаях:</p>
<ul>
<li><p>совпадения Клиента, его представителя или бенефициарного владельца с санкционными списками, указанными в п. 15.3;</p></li>
<li><p>выявления связи Клиента с запрещённой юрисдикцией;</p></li>
<li><p>выявления признаков легализации преступных доходов, финансирования терроризма или иных нарушений законодательства в сфере ПОД/ФТ/ФРОМУ;</p></li>
<li><p>непредоставления запрошенных документов или предоставления недостоверных сведений;</p></li>
<li><p>требования Уполномоченных органов.</p></li>
</ul>
<p>18.4. При расторжении Договора средства (активы) Клиента возвращаются в соответствии с разделом 10, за исключением средств (активов), замороженных в соответствии с разделом 15.</p>
<p>18.5. Расторжение Договора не освобождает Стороны от обязательств, возникших до его расторжения.</p>
<h2 id="ru-s19" class="zx-doc-h">19. Изменение условий оферты</h2>
<p>19.1. Компания вправе изменять условия оферты в одностороннем порядке путём публикации новой редакции на Платформе и уведомления Клиентов.</p>
<p>19.2. Изменения вступают в силу через 10 (десять) календарных дней с даты публикации, если иной срок не указан в уведомлении, и не применяются к Спецификациям, подписанным до вступления изменений в силу. Изменения, обусловленные требованиями законодательства, могут вступать в силу с даты публикации.</p>
<h2 id="ru-s20" class="zx-doc-h">20. Претензионный порядок и разрешение споров</h2>
<p>20.1. Отношения Сторон регулируются законодательством Республики Таджикистан.</p>
<p>20.2. Соблюдение претензионного порядка обязательно. Претензия направляется в письменной форме на адрес электронной почты Компании, указанный в разделе «Реквизиты», и должна содержать описание требования, его основания и прилагаемые документы.</p>
<p>20.3. Компания рассматривает претензию в течение 15 (пятнадцати) рабочих дней с даты её получения. При необходимости получения дополнительных сведений срок может быть продлён до 30 (тридцати) календарных дней с уведомлением Клиента.</p>
<p>20.4. Если спор не урегулирован в претензионном порядке, он передаётся на рассмотрение в суд по месту нахождения Компании, если иная подсудность не установлена законодательством Республики Таджикистан, в том числе законодательством о защите прав потребителей.</p>
<h2 id="ru-s21" class="zx-doc-h">21. Заключительные положения</h2>
<p>21.1. Если какое-либо положение оферты будет признано недействительным, это не влияет на действительность остальных положений.</p>
<p>21.2. По всем вопросам, связанным с офертой, Клиент вправе обращаться в Компанию по контактам, указанным в разделе «Реквизиты».</p>
<p>21.3. Оферта составлена на русском, английском и таджикском языках. В случае расхождений между текстами преимущественную силу имеет текст на русском языке.</p>
