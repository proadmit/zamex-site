<h2 id="tg-s1" class="zx-doc-h">1. Муқаррароти умумӣ</h2>
<p>1.1. Ҳуҷҷати мазкур офертаи оммавии Ҷамъияти дорои масъулияти маҳдуди «ЗАМ РИВОЧ» (ЧДММ «ЗАМ РИВОЧ») мебошад, ки мутобиқи қонунгузории Ҷумҳурии Тоҷикистон ба қайд гирифта шудааст (минбаъд — «Ширкат»), ба доираи номуайяни шахсони воқеӣ, соҳибкорони инфиродӣ ва шахсони ҳуқуқӣ равона шуда, ҳамаи шартҳои муҳими шартномаи комиссияро оид ба анҷом додани амалиётҳо бо дороиҳои рақамӣ (минбаъд — «Шартнома») дар бар мегирад.</p>
<p>1.2. Ширкат резиденти IT Park (ш. Душанбе) мебошад (шаҳодатномаи резидент № ХХХХ аз ХХ.ХХ.20ХХ) ва дар соҳаи дороиҳои рақамӣ ва технологияҳои блокчейн дар доираи намудҳои фаъолияте, ки ба резидентҳои IT Park иҷозат дода шудаанд, фаъолият менамояд.</p>
<p>1.3. Хизматрасониҳо тавассути платформаи электронии ZAMEX (минбаъд — «Платформа») расонида мешаванд, ки дар суроғаи zamex.tj дастрас аст. ZAMEX номгӯи тиҷоратии Платформаи Ширкат мебошад.</p>
<p>1.4. Ширкат хизматрасониҳои мубодилаи ғайрибиржавии (OTC) дороиҳои рақамиро мерасонад: бо супориши Мизоҷ аз номи худ, вале аз ҳисоби Мизоҷ аҳдҳоро оид ба харид, фурӯш, табдил ва интиқоли дороиҳои рақамӣ анҷом медиҳад. Ширкат савдоро бо роҳи муқоисаи дархостҳои Мизоҷон бо ҳамдигар ташкил намекунад, маблағҳоро ба сифати пасандоз қабул намекунад ва маблағҳо ва дороиҳои Мизоҷонро барои фаъолияти савдои худ истифода намебарад.</p>
<p>1.5. Аксепти офертаи мазкур гузоштани аломати розигӣ бо шартҳои оферта аз ҷониби Мизоҷ ҳангоми бақайдгирӣ дар Платформа мебошад. Аз лаҳзаи аксепт Шартнома басташуда ҳисобида мешавад ва Мизоҷ бо ҳамаи шартҳои оферта ва замимаҳои он пурра ва бечунучаро розӣ ҳисобида мешавад. Шартномае, ки бо роҳи аксепт баста шудааст, дар шакли хаттӣ басташуда ҳисобида мешавад.</p>
<p>1.6. Замимаи № 1 «Тарифҳо» қисми ҷудонашавандаи оферта мебошад. Феҳристи дороиҳои рақамӣ ва шабакаҳои дастгиришаванда, инчунин Феҳристи юрисдиксияҳои манъшуда дар Платформа нашр мешаванд ва қисми Шартнома мебошанд.</p>
<h2 id="tg-s2" class="zx-doc-h">2. Мафҳумҳо ва таърифҳо</h2>
<p><strong>Ширкат (Комиссионер)</strong> — ЧДММ «ЗАМ РИВОЧ», шахси ҳуқуқӣ, ки мутобиқи қонунгузории Ҷумҳурии Тоҷикистон ба қайд гирифта шудааст.</p>
<p><strong>Мизоҷ (Комитент)</strong> — шахси воқеии пурра муомиланоки ба синни 18 расида, соҳибкори инфиродӣ ё шахси ҳуқуқӣ, аз ҷумла ғайрирезиденти Ҷумҳурии Тоҷикистон, ки офертаи мазкурро аксепт намуда, мушаххаскуниро гузаштааст.</p>
<p><strong>Платформа (ZAMEX)</strong> — маҷмааи барномавию техникии Ширкат, ки тавассути он Мизоҷ ба қайд гирифта мешавад, мушаххаскуниро мегузарад, Спесификатсияҳоро таҳия ва имзо мекунад ва ҳисоботҳоро мегирад.</p>
<p><strong>Кабинети шахсӣ</strong> — бахши шахсии Мизоҷ дар Платформа, ки маълумотро дар бораи Мизоҷ, Спесификатсияҳо, амалиётҳо ва ҳисоботҳо дар бар мегирад.</p>
<p><strong>Дороиҳои рақамӣ</strong> — дороиҳои рақамие, ки дар системаи иттилоотии тақсимшуда дар асоси технологияи блокчейн эҷод ва ба ҳисоб гирифта мешаванд.</p>
<p><strong>Супориш (Спесификатсия)</strong> — ҳуҷҷати электронӣ, ки дар Кабинети шахсӣ таҳия шуда, аз ҷониби Тарафҳо бо тартиби фасли 8 имзо шудааст ва намуди амалиёт, дороӣ, шабака, маблағ, асъор, қурб, андозаи комиссия, деталҳо ва дигар шартҳои амалиёти мушаххасро дар бар мегирад.</p>
<p><strong>Давраи собиткунии қурб</strong> — давра аз лаҳзаи имзои Спесификатсия аз ҷониби Мизоҷ то анҷоми Рӯзи бонкӣ, ки дар он Спесификатсия имзо шудааст (аз рӯи вақти ш. Душанбе), ки дар давоми он қурби дар Спесификатсия собитшуда амал мекунад.</p>
<p><strong>Fireblocks</strong> — инфрасохтори технологии нигоҳдорӣ ва интиқоли дороиҳои рақамӣ дар асоси технологияи ҳисобкуниҳои бисёрҷониба (MPC), ки Ширкат истифода мебарад.</p>
<p><strong>Ҳамёни Ширкат</strong> — суроға (ҳамён, зерсуратҳисоб)-и Ширкат дар инфрасохтори Fireblocks, ки Мизоҷ ба он дороиҳои рақамиро барои иҷрои Спесификатсия интиқол медиҳад.</p>
<p><strong>Платформаҳои шарикӣ</strong> — бонкҳо, системаҳои пардохтӣ, криптобиржаҳо, операторон ва провайдерҳои пардохтпазирии дороиҳои рақамӣ, ки тавассути онҳо Ширкат Супоришҳои Мизоҷро иҷро мекунад.</p>
<p><strong>Тарифҳо</strong> — андозаи Ҳаққи комиссионӣ, ки дар Замимаи № 1 муқаррар шудааст.</p>
<p><strong>Ҳаққи комиссионӣ (Комиссия)</strong> — подоши Ширкат барои иҷрои Супориш ба андозае, ки Тарифҳо муқаррар кардаанд.</p>
<p><strong>2FA</strong> — аутентификатсияи дуомилаи Мизоҷ бо истифодаи рамзҳои якдафъаина, ки ба суроғаи почтаи электронӣ ва рақами телефони Мизоҷ фиристода мешаванд.</p>
<p><strong>Рӯзи бонкӣ</strong> — рӯзе, ки дар он бонкҳои Ҷумҳурии Тоҷикистон барои анҷом додани амалиётҳо кушодаанд.</p>
<p><strong>KYC/AML</strong> — тартиботи санҷиши дахлдори мизоҷ ва муқовимат ба қонунигардонии (расмикунонии) даромадҳои бо роҳи ҷиноят бадастоварда, маблағгузории терроризм ва маблағгузории паҳнкунии силоҳи қатли ом (минбаъд — AML/CFT).</p>
<p><strong>KYT</strong> — санҷиши суроғаҳо ва транзаксияҳо дар блокчейн бо истифодаи воситаҳои таҳлили блокчейн.</p>
<p><strong>Мақомоти ваколатдор</strong> — мақомоти давлатии Ҷумҳурии Тоҷикистон, ки назорат ва мониторингро дар соҳаи AML/CFT амалӣ мекунанд, инчунин дигар мақомоте, ки Ширкат вазифадор аст дар ҳолатҳои пешбининамудаи қонунгузорӣ ба онҳо маълумот пешниҳод намояд.</p>
<h2 id="tg-s3" class="zx-doc-h">3. Мавзӯи Шартнома ва хусусияти хизматрасониҳо</h2>
<p>3.1. Мувофиқи Шартнома Ширкат (комиссионер) ӯҳдадор мешавад, ки бо супориши Мизоҷ (комитент) барои подош аз номи худ, вале аз ҳисоби Мизоҷ аҳдҳоро бо дороиҳои рақамӣ ва маблағҳои пулӣ, ки дар Спесификатсия нишон дода шудаанд, анҷом диҳад.</p>
<p>3.2. Аз рӯи аҳдҳое, ки Ширкат бо шахсони сеюм барои иҷрои Супориш бастааст, ҳуқуқ ва ӯҳдадориҳоро Ширкат ба даст меорад. Маблағҳои пулӣ ва дороиҳои рақамие, ки аз Мизоҷ ба Ширкат ворид шудаанд, инчунин аз ҳисоби Мизоҷ аз ҷониби Ширкат гирифта шудаанд, моликияти Мизоҷ мебошанд ва бо тартиби муқаррарнамудаи Шартнома бояд ба Мизоҷ супорида шаванд.</p>
<p>3.3. Ягона даромади Ширкат аз рӯи Шартнома Ҳаққи комиссионӣ мутобиқи Тарифҳо мебошад. Ширкат аз фарқияти қурбҳо (спред) даромад намегирад. Қурби табдилро бонкҳо ва Платформаҳои шарикӣ муайян мекунанд; маржаи (спреди) ба қурб воридкардаи онҳо даромади онҳо буда, даромади Ширкат намебошад.</p>
<p>3.4. Ширкат дар назди Мизоҷ кафолати иҷрои аҳдҳоро аз ҷониби шахсони сеюм (делкредере) ба ӯҳда намегирад ва барои иҷро нашудани онҳо масъул нест, ба истиснои ҳолатҳое, ки Ширкат ҳангоми интихоби Платформаи шарикӣ эҳтиёткории зарурӣ зоҳир накардааст (фасли 13).</p>
<h2 id="tg-s4" class="zx-doc-h">4. Нигоҳдории дороиҳои рақамӣ ва маблағҳои пулӣ</h2>
<p>4.1. Дороиҳои рақамие, ки аз Мизоҷ барои иҷрои Супориш ворид шудаанд, дар ҳамёнҳо ё зерсуратҳисобҳои алоҳидаи (ҷудогонаи) дар инфрасохтори Fireblocks кушодаи Ширкат ба ҳисоб гирифта мешаванд. Технологияи MPC нигоҳдории калиди хусусиро пурра дар як ҷой истисно намуда, хатари дастрасии беиҷозатро коҳиш медиҳад.</p>
<p>4.2. Маблағҳои пулии Мизоҷ ба суратҳисобҳои бонкии Ширкат ворид шуда, дар баҳисобгирии дохилии Ширкат барои ҳар як Мизоҷ алоҳида ба ҳисоб гирифта мешаванд.</p>
<p>4.3. Маблағҳои пулӣ ва дороиҳои рақамии Мизоҷ дар Ширкат танҳо транзитӣ — танҳо дар давраи барои иҷрои Супориши мушаххас зарурӣ — қарор доранд ва ба Мизоҷ ё гирандаи нишондодаи ӯ дар мӯҳлати дар Спесификатсия нишондодашуда, агар мӯҳлат нишон дода нашуда бошад — на дертар аз 1 (як) Рӯзи бонкӣ аз лаҳзаи анҷоми амалиёт интиқол дода мешаванд.</p>
<p>4.4. Ширкат маблағҳои пулӣ ва дороиҳои рақамии Мизоҷро ба манфиати худ истифода намебарад, онҳоро ба гарав, қарз ё идоракунии боваринокӣ намедиҳад ва бо дороиҳои худ омехта намекунад.</p>
<p>4.5. Ширкат нигоҳдории дарозмуддати (депозитарии) дороиҳои рақамии Мизоҷро амалӣ намекунад ва ба онҳо фоиз ё дигар даромад ҳисоб намекунад.</p>
<h2 id="tg-s5" class="zx-doc-h">5. Талабот ба Мизоҷон. Мушаххаскунӣ</h2>
<p>5.1. Хизматрасониҳо ба шахсони зерин расонида мешаванд:</p>
<ul>
<li><p>шахсони воқеии ба синни 18 расида, пурра муомиланоке, ки аз номи худ ва ба манфиати худ амал мекунанд;</p></li>
<li><p>соҳибкорони инфиродӣ;</p></li>
<li><p>шахсони ҳуқуқӣ — резидентҳо ва ғайрирезидентҳои Ҷумҳурии Тоҷикистон.</p></li>
</ul>
<p>5.2. Шахси воқеӣ пешниҳод мекунад: ҳуҷҷати тасдиқкунандаи шахсият; тасвири акс ва (ё) видеоие, ки ҳангоми гузаштани верификатсия дар Платформа гирифта шудааст; суроғаи истиқомат; суроғаи почтаи электронӣ ва рақами телефон; маълумот дар бораи резидентии андозӣ, манбаи маблағҳо ва мавҷудияти мақоми шахси мансабдори ҷамъиятӣ (PEP) ё алоқамандӣ бо он.</p>
<p>5.3. Соҳибкори инфиродӣ илова ба маълумоти банди 5.2 ҳуҷҷати бақайдгирии давлатиро ба сифати соҳибкори инфиродӣ пешниҳод мекунад.</p>
<p>5.4. Шахси ҳуқуқӣ пешниҳод мекунад: шаҳодатномаи бақайдгирии давлатӣ; иқтибоси амалкунанда аз феҳрист; ҳуҷҷатҳои таъсисӣ; ҳуҷҷатҳо дар бораи ваколатҳои роҳбар ва намояндагон (ваколатнома); маълумот дар бораи моликони бенефитсиарӣ ва ҳуҷҷатҳои тасдиқкунандаи шахсияти онҳо; маълумот дар бораи хусусияти фаъолият ва манбаи маблағҳо; маълумоти тамос.</p>
<p>5.5. Ширкат ҳуқуқ дорад ҳуҷҷатҳои иловагӣ, нусхаҳои аз ҷиҳати нотариалӣ тасдиқшуда ва тарҷумаҳои онҳоро талаб намояд, мушаххаскунии такрорӣ гузаронад ва мустақилона дар бораи тасдиқ ё рад кардани бақайдгирии Мизоҷ ё иҷрои Супориши мушаххас қарор қабул мекунад.</p>
<p>5.6. Мизоҷ ӯҳдадор аст Ширкатро дар бораи тағйир ёфтани маълумоти ҳангоми мушаххаскунӣ пешниҳодшуда на дертар аз 5 (панҷ) рӯзи корӣ аз санаи тағйирот огоҳ созад.</p>
<h2 id="tg-s6" class="zx-doc-h">6. Маълумоти шахсӣ</h2>
<p>6.1. Бо аксепти оферта Мизоҷ — шахси воқеӣ ё соҳибкори инфиродӣ — ба Ширкат барои коркарди маълумоти шахсии худ мутобиқи Қонуни Ҷумҳурии Тоҷикистон «Дар бораи ҳифзи маълумоти шахсӣ» розигӣ медиҳад. Мизоҷ — шахси ҳуқуқӣ кафолат медиҳад, ки розигии роҳбар, намояндагон ва моликони бенефитсиарии худро барои коркарди маълумоти шахсии онҳо аз ҷониби Ширкат бо шартҳои фасли мазкур гирифтааст.</p>
<p>6.2. Маълумоти зерин коркард карда мешавад: насаб, ном, номи падар; сана ва ҷои таваллуд; шаҳрвандӣ; деталҳои ҳуҷҷати тасдиқкунандаи шахсият; тасвири акс ва видеоие, ки ҳангоми верификатсия гирифта шудааст; суроғаи истиқомат; рақами телефон ва суроғаи почтаи электронӣ; маълумот дар бораи резидентии андозӣ, манбаи маблағҳо ва мақоми PEP; маълумот дар бораи амалиётҳо ва суроғаҳои ҳамёнҳо; суроғаҳои IP ва маълумоти дастгоҳҳое, ки барои дастрасӣ ба Платформа истифода мешаванд.</p>
<p>6.3. Мақсадҳои коркард: бастан ва иҷрои Шартнома; мушаххаскунӣ ва верификатсия; иҷрои талаботи қонунгузорӣ дар соҳаи AML/CFT ва назорати таҳримӣ; таъмини амнияти Платформа; баррасии муроҷиатҳо ва талабномаҳо.</p>
<p>6.4. Коркард ҷамъоварӣ, сабт, мураттабсозӣ, ҷамъшавӣ, нигоҳдорӣ, дақиқсозӣ, истифода, интиқол (пешниҳод, дастрасӣ), беномкунӣ, бастан, нест кардан ва несту нобуд кардани маълумоти шахсиро бо истифода ва бе истифодаи воситаҳои автоматикунонӣ дар бар мегирад.</p>
<p>6.5. Мизоҷ ба интиқоли маълумоти шахсӣ розӣ мешавад: ба бонкҳо ва Платформаҳои шарикӣ — ба ҳаҷми барои иҷрои Супоришҳо зарурӣ; ба провайдерҳои хизматрасониҳои верификатсия, таҳлили блокчейн ва инфрасохтори технологӣ (аз ҷумла Fireblocks) — ба ҳаҷми барои расонидани хизматрасониҳо ба Ширкат зарурӣ; ба Мақомоти ваколатдор — дар ҳолатҳои пешбининамудаи қонунгузорӣ. Мизоҷ ба интиқоли фаромарзии маълумоти шахсӣ ба шахсони зикршуда, аз ҷумла ба давлатҳое, ки қонунгузории онҳо метавонад сатҳи дигари ҳифзи маълумоти шахсиро таъмин намояд, розӣ мешавад.</p>
<p>6.6. Маълумоти шахсӣ дар давоми мӯҳлати амали Шартнома ва на камтар аз 5 (панҷ) сол пас аз қатъ гардидани муносибатҳо бо Мизоҷ нигоҳ дошта мешавад, агар қонунгузорӣ мӯҳлати тӯлонитарро муқаррар накарда бошад.</p>
<p>6.7. Мизоҷ ҳуқуқ дорад маълумотро дар бораи коркарди маълумоти шахсии худ гирад, дақиқ кардани онро талаб кунад ва бо фиристодани огоҳиномаи хаттӣ ба Ширкат розигии худро бозхонад. Бозхонди розигӣ боиси қатъ гардидани Шартнома бо тартиби фасли 18 мегардад. Маълумоте, ки нигоҳдории он мутобиқи қонунгузорӣ дар соҳаи AML/CFT ҳатмист, новобаста аз бозхонди розигӣ дар давоми мӯҳлати дар банди 6.6 нишондодашуда нигоҳ дошта мешавад.</p>
<p>6.8. Ширкат барои ҳифзи маълумоти шахсӣ аз дастрасии ғайриқонунӣ, тағйирдиҳӣ, ифшо ва несту нобудкунӣ чораҳои ҳуқуқӣ, ташкилӣ ва техникӣ меандешад.</p>
<h2 id="tg-s7" class="zx-doc-h">7. Тавсифи хизматрасониҳо</h2>
<p>7.1. Ширкат ба Мизоҷон хизматрасониҳои зеринро мерасонад:</p>
<ul>
<li><p>харидани дороиҳои рақамӣ аз ҳисоби маблағҳои пулии Мизоҷ;</p></li>
<li><p>фурӯхтани дороиҳои рақамии Мизоҷ ба маблағҳои пулӣ;</p></li>
<li><p>табдил додани як дороии рақамӣ ба дигар дороии рақамӣ;</p></li>
<li><p>интиқоли дороиҳои рақамӣ ва (ё) маблағҳои пулӣ бо супориши Мизоҷ ба гирандагони нишондодаи ӯ;</p></li>
<li><p>пешниҳоди ҳисоботҳо дар бораи амалиётҳои иҷрошуда.</p></li>
</ul>
<p>7.2. Амалиётҳо бо дороиҳои рақамӣ ва дар шабакаҳое анҷом дода мешаванд, ки инфрасохтори Fireblocks дастгирӣ мекунад ва дар Феҳристи дороиҳои рақамӣ ва шабакаҳои дастгиришаванда дар Платформа нишон дода шудаанд. Ширкат ҳуқуқ дорад феҳристи мазкурро бо огоҳ кардани Мизоҷон тавассути Платформа тағйир диҳад.</p>
<p>7.3. Ба маблағи амалиётҳо маҳдудият муқаррар карда намешавад. Ширкат ҳуқуқ дорад ҳангоми ҳар маблағи амалиёт ҳуҷҷатҳои тасдиқкунандаи манбаи маблағҳоро талаб намояд.</p>
<h2 id="tg-s8" class="zx-doc-h">8. Гардиши электронии ҳуҷҷатҳо ва амнияти дастрасӣ</h2>
<p>8.1. Спесификатсияҳо, ҳисоботҳо, огоҳиномаҳо ва дигар ҳуҷҷатҳо аз рӯи Шартнома дар шакли электронӣ дар Кабинети шахсӣ ба расмият дароварда мешаванд.</p>
<p>8.2. Воридшавӣ ба Кабинети шахсӣ ва имзои Спесификатсия бо 2FA тасдиқ карда мешаванд: рамзи якдафъаинае, ки ба суроғаи почтаи электронии Мизоҷ фиристода мешавад, ва рамзи якдафъаинае, ки тавассути SMS ба рақами телефони Мизоҷ фиристода мешавад.</p>
<p>8.3. Тарафҳо эътироф мекунанд, ки амалҳои бо 2FA тасдиқшуда аз ҷониби Мизоҷ анҷом дода шудаанд ва ҳуҷҷати электронии бо ин тарз имзошуда ба ҳуҷҷати дар коғаз бо имзои шахсӣ имзошуда (барои шахсони ҳуқуқӣ — аз ҷониби шахси ваколатдор имзошуда ва бо мӯҳр, дар сурати мавҷуд будани он, тасдиқшуда) баробар аст. Спесификатсия аз лаҳзаи тасдиқи он дар Платформа аз ҷониби Ширкат имзошуда ҳисобида мешавад.</p>
<p>8.4. Мизоҷ ӯҳдадор аст махфияти маълумоти ҳисобӣ ва амнияти дастрасӣ ба почтаи электронӣ ва рақами телефони худро таъмин намояд. Хатари амалҳое, ки бо истифодаи 2FA-и Мизоҷ анҷом дода шудаанд, ба зиммаи Мизоҷ аст. Ҳангоми аз даст додани дастрасӣ ё гумони ифшо Мизоҷ ӯҳдадор аст фавран Ширкатро огоҳ созад, ки он дастрасиро ба Кабинети шахсӣ то барқарор гардидани амният маҳдуд мекунад.</p>
<p>8.5. Маҷаллаҳои электронии (логҳои) Платформа аз ҷониби Тарафҳо ҳамчун далели дахлдори амалҳои Мизоҷ ва Ширкат эътироф карда мешаванд.</p>
<p>8.6. Огоҳиномаҳо тавассути Кабинети шахсӣ ва (ё) ба суроғаи почтаи электронии Мизоҷ фиристода мешаванд ва дар рӯзи фиристодан гирифташуда ҳисобида мешаванд.</p>
<h2 id="tg-s9" class="zx-doc-h">9. Тартиби пешниҳод ва иҷрои Супоришҳо. Собиткунии қурб</h2>
<p>9.1. Мизоҷ Спесификатсияро дар Кабинети шахсӣ бо нишон додани намуди амалиёт, дороӣ, шабака, маблағ, асъор, деталҳои гиранда ва дигар шартҳо таҳия мекунад. Ширкат қурби амалиёт, маблағи Комиссия ва маблағи гирифташавандаро тасдиқ мекунад.</p>
<p>9.2. Қурб аз лаҳзаи имзои Спесификатсия аз ҷониби Мизоҷ собит карда мешавад ва то анҷоми Рӯзи бонкӣ, ки дар он Спесификатсия имзо шудааст (аз рӯи вақти ш. Душанбе), амал мекунад. Агар Спесификатсия дар рӯзе имзо шуда бошад, ки Рӯзи бонкӣ намебошад, қурб то анҷоми Рӯзи бонкии наздиктарини оянда амал мекунад.</p>
<p>9.3. Мизоҷ ӯҳдадор аст воридшавии 100%-и маблағи амалиётро — маблағҳои пулӣ ба суратҳисоби бонкии Ширкат ё дороиҳои рақамӣ ба Ҳамёни Ширкат — на дертар аз 1 (як) Рӯзи бонкӣ аз лаҳзаи имзои Спесификатсия таъмин намояд.</p>
<p>9.4. Агар маблағҳо (дороиҳо) дар давоми Давраи собиткунии қурб ворид шуда бошанд, амалиёт бо қурби собитшуда иҷро карда мешавад.</p>
<p>9.5. Агар маблағҳо (дороиҳо) пас аз анҷоми Давраи собиткунии қурб ворид шуда бошанд ва Спесификатсия аз ҷониби Ширкат бекор карда нашуда бошад, амалиёт бо қурби ҷорӣ дар лаҳзаи воридшавӣ иҷро карда мешавад, ки Ширкат дар бораи он Мизоҷро огоҳ мекунад. Хатари тағйирёбии қурб пас аз анҷоми Давраи собиткунии қурб ба зиммаи Мизоҷ аст.</p>
<p>9.6. Дар сурати ворид нашудани маблағҳо (дороиҳо) дар мӯҳлати дар банди 9.3 нишондодашуда, Мизоҷ ба Ширкат ноустуворона (ҷарима) ба андозаи 0,5% (сифр бутуну панҷ даҳяк фоиз)-и маблағи Спесификатсия барои ҳар рӯзи тақвимии таъхир, вале на зиёда аз 10% (даҳ фоиз)-и маблағи Спесификатсия месупорад. Ширкат ҳуқуқ дорад дар ҳар лаҳза пас аз гузаштани мӯҳлати мазкур Спесификатсияро бекор кунад. Ноустуворона то рӯзи воридшавии маблағҳо (дороиҳо) ё то рӯзи бекор кардани Спесификатсия ҳисоб карда мешавад ва метавонад аз ҷониби Ширкат аз маблағҳои (дороиҳои) воридшуда нигоҳ дошта шавад.</p>
<p>9.7. Ширкат Супоришро дар мӯҳлати дар Спесификатсия нишондодашуда, агар мӯҳлат нишон дода нашуда бошад — дар мӯҳлати оқилона бо назардошти хусусияти амалиёт ва фаъолияти Платформаҳои шарикӣ иҷро мекунад.</p>
<p>9.8. Ширкат ҳуқуқ дорад аз иҷрои Супориш даст кашад ё иҷрои онро боздорад дар сурати мавҷуд набудан ё нокифоя будани маблағҳои (дороиҳои) Мизоҷ, ошкор шудани нишонаҳои амалиёти шубҳанок, мувофиқат ҳангоми санҷиши таҳримӣ, инчунин бо сабабҳое, ки ба Ширкат вобаста нестанд (нокомиҳои техникии Платформаҳои шарикӣ, бонкҳо, системаҳои пардохтӣ, шабакаҳои блокчейн, инфрасохтори Fireblocks).</p>
<p>9.9. Ширкат ба Мизоҷ ҳисоботро дар бораи амалиёти иҷрошуда дар Кабинети шахсӣ на дертар аз 1 (як) Рӯзи бонкӣ пас аз анҷоми он бо нишон додани маблағ, қурб, Комиссияи нигоҳдошташуда ва хароҷоти шахсони сеюм пешниҳод мекунад. Агар Мизоҷ дар давоми 3 (се) Рӯзи бонкӣ аз санаи пешниҳоди ҳисобот эътироз нафиристад, ҳисобот қабулшуда ҳисобида мешавад.</p>
<h2 id="tg-s10" class="zx-doc-h">10. Баргардонидани маблағҳо</h2>
<p>10.1. Дар сурати даст кашидан аз иҷро, бекор кардани Спесификатсия ё ғайриимкон будани иҷрои Супориш маблағҳои пулӣ (дороиҳои рақамӣ) дар давоми 2 (ду) Рӯзи бонкӣ ба суратҳисобе (суроғае), ки аз он ворид шуда буданд, ба Мизоҷ баргардонида мешаванд.</p>
<p>10.2. Агар баргардонидан ба суратҳисоби (суроғаи) аввалия аз ҷиҳати техникӣ ғайриимкон бошад, баргардонидан ба дигар суратҳисоби (суроғаи) верификатсияшудаи Мизоҷ дар асоси аризаи хаттии ӯ пас аз гузаронидани санҷишҳои зарурӣ анҷом дода мешавад.</p>
<p>10.3. Баргардонидан бо ҳамон асъор (ҳамон дороии рақамӣ) ва ба ҳамон маблағ (миқдор), ки ворид шуда буданд, бо тарҳи хароҷоти воқеан анҷомдодаи шахсони сеюм ва ноустуворонаи ҳисобшуда анҷом дода мешавад. Барои амалиёти иҷронашуда Комиссия ситонида намешавад.</p>
<p>10.4. Мӯҳлати баргардонидан, ки дар банди 10.1 нишон дода шудааст, татбиқ намегардад, агар маблағҳо (дороиҳо) мутобиқи қонунгузорӣ дар соҳаи AML/CFT, маҳдудиятҳои таҳримӣ ё бо талаби Мақомоти ваколатдор боздошта ё ях карда шуда бошанд. Дар ин ҳолат баргардонидан пас аз бартараф шудани маҳдудиятҳо анҷом дода мешавад.</p>
<h2 id="tg-s11" class="zx-doc-h">11. Ҳаққи комиссионӣ. Андозҳо</h2>
<p>11.1. Барои иҷрои Супоришҳо Мизоҷ ба Ширкат Ҳаққи комиссиониро аз рӯи тарифи ягонае, ки Замимаи № 1 муқаррар кардааст, месупорад.</p>
<p>11.2. Ҳаққи комиссионӣ аз ҷониби Ширкат дар лаҳзаи иҷрои амалиёт аз маблағҳои (дороиҳои) барои иҷрои Супориш супоридаи Мизоҷ нигоҳ дошта мешавад.</p>
<p>11.3. Ширкат аз Мизоҷ ба ғайр аз Ҳаққи комиссионӣ, ноустуворона мутобиқи банди 9.6 ва хароҷоти бо ҳуҷҷатҳо тасдиқшудаи шахсони сеюм, ки бевосита бо иҷрои Супориш алоқаманданд (комиссияҳои шабакаи блокчейн, комиссияҳои бонкҳо ва Платформаҳои шарикӣ), дигар пардохтҳо намеситонад. Чунин хароҷот дар Спесификатсия ва (ё) ҳисобот нишон дода мешаванд.</p>
<p>11.4. Ширкат ҳуқуқ дорад Тарифҳоро яктарафа тағйир диҳад, бо огоҳ кардани Мизоҷон на камтар аз 10 (даҳ) рӯзи тақвимӣ пеш аз эътибор пайдо кардани тағйирот. Ба Спесификатсияҳое, ки то эътибор пайдо кардани тағйирот имзо шудаанд, Тарифҳои қаблӣ татбиқ мегарданд.</p>
<p>11.5. Ҳаққи комиссионӣ ниҳоӣ буда, андозҳоеро, ки Ширкат бояд супорад, дар сурати татбиқшаванда будан, дар бар мегирад. Мизоҷ ӯҳдадориҳои андозии худро, ки вобаста ба амалиётҳо бо дороиҳои рақамӣ ба миён меоянд, мустақилона мутобиқи қонунгузории кишвари резидентии андозии худ иҷро мекунад.</p>
<h2 id="tg-s12" class="zx-doc-h">12. Ҳуқуқ ва ӯҳдадориҳои Тарафҳо</h2>
<p>12.1. Ширкат ӯҳдадор аст:</p>
<ul>
<li><p>Супоришҳоро бо виҷдон ва мутобиқи шартҳои Спесификатсия иҷро намояд;</p></li>
<li><p>баҳисобгирии ҷудогонаи маблағҳо ва дороиҳои рақамии ҳар як Мизоҷро мутобиқи фасли 4 таъмин намояд;</p></li>
<li><p>махфияти маълумотро дар бораи Мизоҷ ва амалиётҳои ӯ таъмин намояд;</p></li>
<li><p>ҳисоботҳоро мутобиқи банди 9.9 пешниҳод намояд;</p></li>
<li><p>Мизоҷро дар бораи хатарҳои амалиётҳо бо дороиҳои рақамӣ огоҳ намояд;</p></li>
<li><p>тартиботи KYC/AML ва назорати таҳримиро гузаронад;</p></li>
<li><p>Платформаҳои шарикиро мутобиқи фасли 13 интихоб намояд.</p></li>
</ul>
<p>12.2. Ширкат ҳуқуқ дорад:</p>
<ul>
<li><p>аз Мизоҷ ҳуҷҷатҳо ва маълумоти иловагӣ талаб намояд;</p></li>
<li><p>бе фаҳмонидани сабабҳо аз бақайдгирӣ ё иҷрои Супориш даст кашад, агар ин ба қонунгузории Ҷумҳурии Тоҷикистон мухолиф набошад;</p></li>
<li><p>амалиётҳоро боздорад ва маблағҳои (дороиҳои) Мизоҷро мутобиқи фасли 15 ях кунад;</p></li>
<li><p>Платформаҳои шарикиро, ки ба талаботи фасли 13 ҷавобгӯянд, ҷалб намояд;</p></li>
<li><p>Тарифҳо ва шартҳои офертаро бо тартиби пешбининамудаи Шартнома тағйир диҳад.</p></li>
</ul>
<p>12.3. Мизоҷ ӯҳдадор аст:</p>
<ul>
<li><p>ҳуҷҷатҳо ва маълумоти саҳеҳ пешниҳод намояд;</p></li>
<li><p>маблағҳои пулӣ ва (ё) дороиҳои рақамиро мутобиқи Спесификатсия сари вақт интиқол диҳад;</p></li>
<li><p>маблағҳои пулиро танҳо аз суратҳисобҳои бонкии худ ва дороиҳои рақамиро танҳо аз суроғаҳое, ки таҳти назорати ӯ қарор доранд, интиқол диҳад;</p></li>
<li><p>хизматрасониҳои Ширкатро ба манфиати шахсони сеюм бидуни ошкор кардани ин ба Ширкат, инчунин бо мақсади қонунигардонии даромадҳои ҷиноятӣ, маблағгузории терроризм ё маблағгузории паҳнкунии силоҳи қатли ом истифода набарад;</p></li>
<li><p>дурустии деталҳоро мутобиқи банди 12.4 мустақилона санҷад.</p></li>
</ul>
<p>12.4. Мизоҷ дурустии деталҳои дар Спесификатсия нишондодашударо мустақилона месанҷад: суроғаи ҳамён, шабака, тег (memo) ва деталҳои бонкӣ. Амалиётҳо дар блокчейн бебозгашт мебошанд. Зарарҳое, ки дар натиҷаи нишон додани деталҳои нодуруст аз ҷониби Мизоҷ, интиқоли дороӣ дар шабакаи дастгиринашаванда ё интиқоли дороии дастгиринашаванда ба Ҳамёни Ширкат ба миён омадаанд, ба зиммаи Мизоҷ мебошанд. Ширкат ӯҳдадор нест чунин дороиҳоро барқарор кунад, вале ҳуқуқ дорад бо аризаи Мизоҷ аз ҳисоби Мизоҷ кӯшиши баргардонидани онҳоро намояд.</p>
<p>12.5. Мизоҷ тасдиқ мекунад, ки бо хатарҳои амалиётҳо бо дороиҳои рақамӣ, аз ҷумла бо хатари ноустувории арзиши онҳо, мавҷуд набудани кафолати давлатии дороиҳои рақамӣ, хатари нокомиҳои техникии шабакаҳои блокчейн ва инфрасохтор, инчунин имконияти пурра ё қисман аз даст додани маблағҳо бо сабаби ҳолатҳое, ки ба Ширкат вобаста нестанд, шинос аст.</p>
<h2 id="tg-s13" class="zx-doc-h">13. Интихоби Платформаҳои шарикӣ</h2>
<p>13.1. Ширкат Платформаҳои шарикиеро ҷалб мекунад, ки ба талаботи зерин ҷавобгӯ мебошанд:</p>
<ul>
<li><p>мавҷудияти иҷозатнома ё иҷозат барои фаъолияти дахлдор дар юрисдиксияи худ, агар чунин талабот аз ҷониби қонунгузории ин юрисдиксия муқаррар шуда бошад;</p></li>
<li><p>мавҷудияти сиёсат ва тартиботи амалкунандаи KYC/AML ва назорати таҳримӣ;</p></li>
<li><p>набудани Платформаи шарикӣ, моликони бенефитсиарӣ ва роҳбарони он дар рӯйхатҳои таҳримии дар банди 15.3 нишондодашуда ва бақайдгирии он берун аз юрисдиксияҳои манъшуда;</p></li>
<li><p>обрӯи боэътимоди корӣ ва мавҷуд набудани маълумоти манфии ҷиддӣ;</p></li>
<li><p>эътимоднокии техникӣ ва амнияти нигоҳдории дороиҳо;</p></li>
<li><p>устувории молиявӣ.</p></li>
</ul>
<p>13.2. Ширкат Платформаи шарикиро пеш аз оғози ҳамкорӣ месанҷад ва мутобиқати онро ба талабот на камтар аз як маротиба дар як сол, инчунин ҳангоми гирифтани маълумоти манфии ҷиддӣ аз нав баррасӣ мекунад. Ҳангоми ошкор шудани номутобиқатӣ Ширкат истифодаи Платформаи шарикиро барои Супоришҳои нав қатъ мекунад.</p>
<p>13.3. Ҳангоми риояи талаботи фасли мазкур Ширкат барои амалҳо ва иҷро накардани ӯҳдадориҳо аз ҷониби Платформаҳои шарикӣ масъулият надорад.</p>
<h2 id="tg-s14" class="zx-doc-h">14. Масъулияти Тарафҳо</h2>
<p>14.1. Барои иҷро накардан ё иҷрои номатлуби ӯҳдадориҳо аз рӯи Шартнома Тарафҳо мутобиқи қонунгузории Ҷумҳурии Тоҷикистон масъулият доранд.</p>
<p>14.2. Масъулияти Ширкат барои зарари воқеии ба Мизоҷ расонидашуда бо маблағи Ҳаққи комиссионии воқеан гирифташуда аз рӯи амалиёти дахлдор маҳдуд карда мешавад, ба истиснои ҳолатҳои қасд ё беэҳтиётии дағали Ширкат, инчунин аз даст рафтани маблағҳо (дороиҳо)-и дар суратҳисобҳо ва Ҳамёнҳои Ширкат қарордошта бо гуноҳи Ширкат. Нисбат ба Мизоҷон — шахсони воқеӣ маҳдудияти масъулият ба андозае татбиқ мегардад, ки қонунгузории Ҷумҳурии Тоҷикистон иҷозат медиҳад.</p>
<p>14.3. Ширкат масъулият надорад барои:</p>
<ul>
<li><p>зарарҳое, ки дар натиҷаи тағйирёбии қурби дороиҳои рақамӣ, аз ҷумла пас аз анҷоми Давраи собиткунии қурб, ба миён омадаанд;</p></li>
<li><p>нокомиҳои техникии бонкҳо, системаҳои пардохтӣ, шабакаҳои блокчейн ва инфрасохтори Fireblocks, ки бе гуноҳи Ширкат ба миён омадаанд;</p></li>
<li><p>амалҳои Платформаҳои шарикӣ бо назардошти банди 13.3;</p></li>
<li><p>иҷро накардани ӯҳдадориҳо аз ҷониби контрагентҳои Мизоҷ;</p></li>
<li><p>зарарҳое, ки дар натиҷаи нишон додани деталҳои нодуруст аз ҷониби Мизоҷ ё ифшои 2FA-и ӯ ба миён омадаанд;</p></li>
<li><p>оқибатҳои чораҳое, ки мутобиқи фасли 15 андешида шудаанд.</p></li>
</ul>
<p>14.4. Мизоҷ барои саҳеҳии ҳуҷҷатҳо ва маълумоти пешниҳодшуда, барои қонунӣ будани пайдоиши маблағҳои (дороиҳои) интиқолдодашуда масъул буда, зарарҳои ба Ширкат дар натиҷаи вайрон кардани ин ӯҳдадориҳо расонидашударо ҷуброн мекунад.</p>
<h2 id="tg-s15" class="zx-doc-h">15. Муқовимат ба қонунигардонии даромадҳои ҷиноятӣ. Назорати таҳримӣ</h2>
<p>15.1. Ширкат фаъолияти худро мутобиқи қонунгузории Ҷумҳурии Тоҷикистон дар бораи муқовимат ба қонунигардонии (расмикунонии) даромадҳои бо роҳи ҷиноят бадастоварда, маблағгузории терроризм ва маблағгузории паҳнкунии силоҳи қатли ом, инчунин бо назардошти тавсияҳои ФАТФ амалӣ мекунад.</p>
<p>15.2. Ширкат чораҳои зеринро татбиқ мекунад:</p>
<ul>
<li><p>мушаххаскунӣ ва верификатсияи Мизоҷон, намояндагон ва моликони бенефитсиарии онҳо;</p></li>
<li><p>равиши ба хатар асосёфта ва санҷиши амиқ нисбат ба Мизоҷони дорои хатари баланд, аз ҷумла PEP;</p></li>
<li><p>муайян кардани манбаи маблағҳо ва дар ҳолати зарурӣ манбаи сарват;</p></li>
<li><p>мониторинги доимии амалиётҳо;</p></li>
<li><p>санҷиши суроғаҳо ва транзаксияҳо бо воситаҳои KYT;</p></li>
<li><p>ҷамъоварӣ ва интиқоли маълумот дар бораи фиристанда ва гиранда ҳангоми интиқоли дороиҳои рақамӣ (Travel Rule) дар ҳолатҳои татбиқшаванда;</p></li>
<li><p>нигоҳдории маълумот ва ҳуҷҷатҳо на камтар аз 5 (панҷ) сол пас аз қатъ гардидани муносибатҳо бо Мизоҷ.</p></li>
</ul>
<p>15.3. Мизоҷон, намояндагон, моликони бенефитсиарӣ ва гирандагони маблағҳои онҳо ҳангоми барқарор кардани муносибатҳо ва ба таври доимӣ аз рӯи манбаъҳои зерин санҷида мешаванд:</p>
<ul>
<li><p>рӯйхатҳои шахсоне, ки ба фаъолияти террористӣ ва маблағгузории паҳнкунии силоҳи қатли ом алоқаманданд, мутобиқи қонунгузории Ҷумҳурии Тоҷикистон;</p></li>
<li><p>рӯйхатҳои таҳримии Шӯрои Амнияти СММ;</p></li>
<li><p>рӯйхатҳои таҳримии Идораи назорати дороиҳои хориҷии Вазорати молияи ИМА (OFAC), аз ҷумла рӯйхати SDN;</p></li>
<li><p>пойгоҳи маълумоти LSEG World-Check, аз ҷумла дар қисми PEP ва маълумоти манфӣ.</p></li>
</ul>
<p>15.4. Ширкат ба шахсоне, ки дар юрисдиксияҳои зерин ба қайд гирифта шудаанд, истиқомат мекунанд ё қарор доранд, хизмат намерасонад ва амалиётҳои бо онҳо алоқамандро анҷом намедиҳад:</p>
<ul>
<li><p>юрисдиксияҳое, ки нисбат ба онҳо ФАТФ ба татбиқи чораҳои ҷавобӣ даъват мекунад;</p></li>
<li><p>давлатҳо ва қаламравҳое, ки нисбат ба онҳо таҳримҳои ҳамаҷонибаи СММ ё OFAC амал мекунанд;</p></li>
<li><p>давлатҳо ва қаламравҳои дорои фаъолнокии баланди террористӣ.</p></li>
</ul>
<p>Феҳристи амалкунандаи юрисдиксияҳои манъшуда дар Платформа нашр мешавад. Нисбат ба шахсони юрисдиксияҳое, ки таҳти мониторинги пурзӯри ФАТФ қарор доранд, санҷиши амиқ татбиқ карда мешавад.</p>
<p>15.5. Ширкат амалиётҳоро бо маблағҳо (дороиҳо)-е, ки бо хизматрасониҳои омехтакунӣ (миксерҳо), бозорҳои даркнет, қаллобӣ, дуздӣ ва рахнакунӣ, барномаҳои тамаъҷӯёна, фаъолияти ғайриқонунии бозиҳои қимор, маблағгузории терроризм, суроғаҳо ва шахсони дар рӯйхатҳои таҳримӣ қарордошта алоқаманданд, қабул ва иҷро намекунад. Маблағҳои пулӣ аз шахсони сеюм (на аз суратҳисобҳои худи Мизоҷ) қабул карда намешаванд ва ба фиристанда баргардонида мешаванд.</p>
<p>15.6. Ҳангоми ошкор шудани нишонаҳои амалиёти шубҳанок, мувофиқат бо рӯйхатҳои таҳримӣ, пешниҳод накардани ҳуҷҷатҳои талабшуда ё бо талаби Мақомоти ваколатдор Ширкат ҳуқуқ дорад: аз анҷом додани амалиёт даст кашад; амалиётро боздорад; маблағҳоро (дороиҳоро) ях кунад; ба Мақомоти ваколатдор хабар диҳад; Шартномаро мутобиқи банди 18.3 бекор кунад. Ширкат Мизоҷро дар бораи интиқоли маълумот ба Мақомоти ваколатдор огоҳ намекунад, агар ин аз ҷониби қонунгузорӣ манъ карда шуда бошад.</p>
<p>15.7. Чораҳое, ки Ширкат мутобиқи фасли мазкур андешидааст, вайрон кардани Шартнома намебошанд ва Ширкат зарарҳои вобаста ба татбиқи онҳоро ба Мизоҷ ҷуброн намекунад.</p>
<h2 id="tg-s16" class="zx-doc-h">16. Махфият</h2>
<p>16.1. Ширкат махфияти маълумотро дар бораи Мизоҷ ва амалиётҳои ӯ таъмин намуда, онро ба шахсони сеюм ифшо намекунад, ба истиснои ҳолатҳои пешбининамудаи қонунгузории Ҷумҳурии Тоҷикистон ва Шартнома (аз ҷумла банди 6.5).</p>
<p>16.2. Ширкат ҳуқуқ дорад маълумотро дар бораи Мизоҷ бо дархости қонунии Мақомоти ваколатдор ва дар ҳолатҳои пешбининамудаи қонунгузорӣ ба онҳо ифшо намояд.</p>
<h2 id="tg-s17" class="zx-doc-h">17. Ҳолатҳои рафънопазир (форс-мажор)</h2>
<p>17.1. Тарафҳо аз масъулият барои иҷро накардани ӯҳдадориҳо озод карда мешаванд, агар он натиҷаи ҳолатҳои рафънопазир (офатҳои табиӣ, амалиёти ҳарбӣ, ҷорӣ намудани таҳримҳо, тағйироти қонунгузорӣ, нокомиҳои техникии хусусияти глобалидошта ва дигар ҳолатҳое, ки ба Тарафҳо вобаста нестанд), ки пас аз бастани Шартнома ба миён омадаанд, бошад.</p>
<p>17.2. Тарафе, ки барои он чунин ҳолатҳо ба миён омадаанд, дар давоми 5 (панҷ) рӯзи корӣ Тарафи дигарро огоҳ мекунад. Агар ҳолатҳо зиёда аз 30 (сӣ) рӯзи тақвимӣ идома ёбанд, ҳар яке аз Тарафҳо ҳуқуқ дорад Шартномаро бекор кунад.</p>
<h2 id="tg-s18" class="zx-doc-h">18. Мӯҳлати амал ва бекор кардани Шартнома</h2>
<p>18.1. Шартнома аз лаҳзаи аксепти оферта эътибор пайдо мекунад ва ба мӯҳлати номуайян баста мешавад.</p>
<p>18.2. Ҳар яке аз Тарафҳо ҳуқуқ дорад Шартномаро бо огоҳ кардани Тарафи дигар на камтар аз 10 (даҳ) рӯзи тақвимӣ пеш, бо шарти анҷом ёфтани ҳамаи Спесификатсияҳои қаблан имзошуда, бекор кунад.</p>
<p>18.3. Ширкат ҳуқуқ дорад Шартномаро яктарафа бе огоҳии пешакӣ, аз санаи фиристодани огоҳинома ба Мизоҷ, дар ҳолатҳои зерин бекор кунад:</p>
<ul>
<li><p>мувофиқати Мизоҷ, намоянда ё моликони бенефитсиарии ӯ бо рӯйхатҳои таҳримии дар банди 15.3 нишондодашуда;</p></li>
<li><p>ошкор шудани алоқамандии Мизоҷ бо юрисдиксияи манъшуда;</p></li>
<li><p>ошкор шудани нишонаҳои қонунигардонии даромадҳои ҷиноятӣ, маблағгузории терроризм ё дигар вайронкуниҳои қонунгузорӣ дар соҳаи AML/CFT;</p></li>
<li><p>пешниҳод накардани ҳуҷҷатҳои талабшуда ё пешниҳоди маълумоти бардурӯғ;</p></li>
<li><p>талаби Мақомоти ваколатдор.</p></li>
</ul>
<p>18.4. Ҳангоми бекор кардани Шартнома маблағҳои (дороиҳои) Мизоҷ мутобиқи фасли 10 баргардонида мешаванд, ба истиснои маблағҳои (дороиҳои) мутобиқи фасли 15 яхкардашуда.</p>
<p>18.5. Бекор кардани Шартнома Тарафҳоро аз ӯҳдадориҳое, ки то бекор кардани он ба миён омадаанд, озод намекунад.</p>
<h2 id="tg-s19" class="zx-doc-h">19. Тағйир додани шартҳои оферта</h2>
<p>19.1. Ширкат ҳуқуқ дорад шартҳои офертаро яктарафа бо роҳи нашри таҳрири нав дар Платформа ва огоҳ кардани Мизоҷон тағйир диҳад.</p>
<p>19.2. Тағйирот пас аз 10 (даҳ) рӯзи тақвимӣ аз санаи нашр эътибор пайдо мекунанд, агар дар огоҳинома мӯҳлати дигар нишон дода нашуда бошад, ва ба Спесификатсияҳое, ки то эътибор пайдо кардани тағйирот имзо шудаанд, татбиқ намегарданд. Тағйироте, ки бо талаботи қонунгузорӣ вобастаанд, метавонанд аз санаи нашр эътибор пайдо кунанд.</p>
<h2 id="tg-s20" class="zx-doc-h">20. Тартиби талабномавӣ ва ҳалли баҳсҳо</h2>
<p>20.1. Муносибатҳои Тарафҳо бо қонунгузории Ҷумҳурии Тоҷикистон танзим карда мешаванд.</p>
<p>20.2. Риояи тартиби талабномавӣ ҳатмист. Талабнома (претензия) дар шакли хаттӣ ба суроғаи почтаи электронии Ширкат, ки дар фасли «Деталҳои Ширкат» нишон дода шудааст, фиристода мешавад ва бояд тавсифи талабот, асосҳои он ва ҳуҷҷатҳои замимашавандаро дар бар гирад.</p>
<p>20.3. Ширкат талабномаро дар давоми 15 (понздаҳ) рӯзи корӣ аз санаи гирифтани он баррасӣ мекунад. Дар сурати зарурати гирифтани маълумоти иловагӣ мӯҳлат метавонад то 30 (сӣ) рӯзи тақвимӣ бо огоҳ кардани Мизоҷ тамдид карда шавад.</p>
<p>20.4. Агар баҳс бо тартиби талабномавӣ ҳал нашавад, он барои баррасӣ ба суди маҳалли ҷойгиршавии Ширкат супорида мешавад, агар қонунгузории Ҷумҳурии Тоҷикистон, аз ҷумла қонунгузорӣ дар бораи ҳимояи ҳуқуқҳои истеъмолкунандагон, тобеияти дигарро муқаррар накарда бошад.</p>
<h2 id="tg-s21" class="zx-doc-h">21. Муқаррароти хотимавӣ</h2>
<p>21.1. Агар ягон муқаррароти оферта беэътибор дониста шавад, ин ба эътибори муқаррароти боқимонда таъсир намерасонад.</p>
<p>21.2. Оид ба ҳамаи масъалаҳои марбут ба оферта Мизоҷ ҳуқуқ дорад ба Ширкат тавассути маълумоти тамоси дар фасли «Деталҳои Ширкат» нишондодашуда муроҷиат намояд.</p>
<p>21.3. Офертаи мазкур бо забонҳои русӣ, англисӣ ва тоҷикӣ тартиб дода шудааст. Дар сурати мавҷуд будани ихтилоф байни матнҳо, матни русӣ бартарӣ дорад.</p>
